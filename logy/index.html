<style>
/* Layout: one-column shop ledger; brand header, scrollable section chips, record cards, floating add + voice buttons.
   Skins swap the accent family; data-mode forces light/dark; data-shape sets corner radius; data-font sets the display face. */
:root{
  --a-l:#7b2d5b; --as-l:#f4e6ee; --bg-l:#faf6f7; --a-d:#e08bb8; --as-d:#3a2131; --bg-d:#171015;
  --accent:var(--a-l); --accent-soft:var(--as-l); --bg:var(--bg-l); --accent-ink:#ffffff;
  --surface:#ffffff; --ink:#2a1a26; --muted:#76666f; --line:#e7dfe3; --focus:#c08a2a;
  --good:#2f7d55; --good-soft:#e3f2ea; --bad:#b3412f; --bad-soft:#f8e4e0; --warn:#9a6200; --warn-soft:#fbefd9;
  --r:14px;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-latin:"Marcellus",Georgia,serif;
}
:root[data-skin="champagne"]{--a-l:#8a6420;--as-l:#f3e9d6;--bg-l:#fbf7f0;--a-d:#d9b36b;--as-d:#3a3020;--bg-d:#15120d}
:root[data-skin="gold"]{--a-l:#86661c;--as-l:#f3ecd9;--bg-l:#f8f6f1;--a-d:#d9b36b;--as-d:#3a3020;--bg-d:#131210}
:root[data-skin="rose"]{--a-l:#b0436a;--as-l:#fbe7ee;--bg-l:#fdf7f9;--a-d:#f29bb9;--as-d:#3d1f2a;--bg-d:#1a1114}
:root[data-skin="sage"]{--a-l:#4f6b3a;--as-l:#e8efe0;--bg-l:#f6f8f3;--a-d:#a8c98a;--as-d:#263222;--bg-d:#121510}
:root[data-skin="navy"]{--a-l:#23427a;--as-l:#e3eaf7;--bg-l:#f5f7fb;--a-d:#8fb0ee;--as-d:#1e2a40;--bg-d:#0f131b}
:root[data-shape="sharp"]{--r:4px} :root[data-shape="round"]{--r:22px}
:root[data-font="lalezar"]{--f-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif}
:root[data-font="amiri"]{--f-display:"Amiri","IBM Plex Sans Arabic",Georgia,serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-mode="light"]){
  --accent:var(--a-d); --accent-soft:var(--as-d); --bg:var(--bg-d); --accent-ink:#1a0f16;
  --surface:#211b20; --ink:#f1eaee; --muted:#b3a3ad; --line:#3a3037; --focus:#e5bd6a;
  --good:#5cc28c; --good-soft:#1d3428; --bad:#f07a66; --bad-soft:#3d211c; --warn:#e0a63a; --warn-soft:#3a2c14; color-scheme:dark}}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --accent:var(--a-d); --accent-soft:var(--as-d); --bg:var(--bg-d); --accent-ink:#1a0f16;
  --surface:#211b20; --ink:#f1eaee; --muted:#b3a3ad; --line:#3a3037; --focus:#e5bd6a;
  --good:#5cc28c; --good-soft:#1d3428; --bad:#f07a66; --bad-soft:#3d211c; --warn:#e0a63a; --warn-soft:#3a2c14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{padding-block:16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand .latin{font-family:var(--f-latin);font-size:26px;letter-spacing:.08em;color:var(--accent)}
.brand-row{display:flex;align-items:center;gap:10px}
.mark{width:52px;height:52px;border-radius:50%;box-shadow:0 2px 10px rgba(120,85,30,.25);flex:0 0 auto}
.banner{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:1600/595;object-fit:cover;border-radius:var(--r);margin-top:14px;border:1px solid var(--line)}
#splash{position:fixed;inset:0;z-index:50;background:#f6efe3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;transition:opacity .5s ease}

#gate{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
#gate .box{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:6px}

.brand .ar{font-size:12px;color:var(--muted)}
.who{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.who select{width:auto;padding:4px 8px;font-size:13px}
.sync{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.sync.off{background:var(--warn-soft);color:var(--warn)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer}
.tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
h2{font-family:var(--f-display);font-weight:700;font-size:23px;margin:20px 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:22px 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:62ch}
.num{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 12px}
.seg button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:13px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kpi.hero .l{color:inherit;opacity:.9;font-size:14px}
.kpi.hero .v{font-size:28px;font-family:var(--f-display)}
.kpi.hero small{display:block;font-size:12px;opacity:.85}
.pos{color:var(--good)} .neg{color:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.row .t{font-weight:700;min-width:0}
.row .s{color:var(--muted);font-size:13px;min-width:0}
.row .a{font-weight:700;font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.row .lines{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.pill{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-inline-start:6px;font-weight:500;vertical-align:middle;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:4px 12px;border-radius:calc(var(--r)*.6);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.fab:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bars{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bar{display:grid;grid-template-columns:7.5em 1fr 6.5em;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters input{flex:1 1 180px}
input,select,textarea{font:inherit;font-size:15px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:calc(var(--r)*.6);background:var(--bg);color:var(--ink)}
.fabs{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.fab{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;font:inherit;font-weight:700;font-size:16px;padding:12px 20px;box-shadow:0 6px 18px rgba(40,15,30,.28);cursor:pointer}
.fab.alt{background:var(--surface);color:var(--accent);border:1px solid var(--accent);font-size:14px;padding:8px 16px}
.fab svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,8,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet h2{margin-top:0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sheet .btns .btn{padding:10px 18px;font-size:15px}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.preview{background:var(--accent-soft);color:var(--accent);border-radius:calc(var(--r)*.6);padding:8px 10px;font-size:13.5px;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;padding:8px 12px;border-radius:calc(var(--r)*.6);cursor:pointer;display:flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;font-weight:700}
.sw{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.ex{font-size:13px;text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand-row"><img class="mark" src="logo-round.png" alt="" width="52" height="52"><div class="brand"><span class="latin">Atelier Logy</span><span class="ar">أتيليه لوجي · فساتين · عبايات · حريمي · أطفال</span></div></div>
    <div class="who"><span id="sync" class="sync">أونلاين</span><span id="demoWho"><label for="meSel">شغال دلوقتي:</label><select id="meSel"></select></span><span id="realWho" hidden></span></div>

<script>
const KEY='logy_fashion_demo_v2';
const LOOK_KEY='atelier_logy_look_v1';
const CATS=['أطفال','حريمي بيتي','حريمي خروج','عبايات','فساتين زفاف','فساتين خطوبة','فساتين حفلات'];
const EXP_TYPES=['إيجار المحل','كهرباء ومياه','مرتبات','نقل بضاعة','شنط وتغليف','دعاية','صيانة','أخرى'];
const MODES={cash:'كاش',credit:'آجل',inst:'تقسيط'};
const ALL_TABS=[['home','الرئيسية'],['customers','حسابات العملاء'],['sales','البيع'],['rentals','التأجير'],['purchases','الوارد'],['suppliers','الموردين'],['expenses','المصروفات'],['items','الأصناف'],['log','اللي حصل'],['settings','الشكل والمستخدمين']];
const SELLER_TABS=['sales','rentals','customers','items','expenses'];
const SKINS=[['champagne','شامبين وذهبي (لون اللوجو)','#b8893a'],['plum','برقوقي','#7b2d5b'],['gold','أسود وذهبي','#86661c'],['rose','وردي','#b0436a'],['sage','زيتي','#4f6b3a'],['navy','كحلي','#23427a']];
const SHAPES=[['soft','ناعم'],['sharp','حاد'],['round','دائري']];
const FONTS=[['kufi','كوفي','Reem Kufi'],['lalezar','عريض','Lalezar'],['amiri','نسخ كلاسيك','Amiri']];
const MODES_UI=[['auto','تلقائي'],['light','فاتح'],['dark','غامق']];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const dayOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=new Date(s+'T12:00');d.setMonth(d.getMonth()+n);return ymd(d)};
const money=n=>'⁦'+(Math.round(n)||0).toLocaleString('en-US')+' ج⁩';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m};
const fmtTime=iso=>{const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const sum=(arr,f)=>arr.reduce((a,x)=>a+(+f(x)||0),0);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- sample data ---------- */
function seed(){
  const users=[{id:'u1',name:'أحمد',role:'مدير'},{id:'u2',name:'منى',role:'بياع'},{id:'u3',name:'كريم',role:'بياع'}];
  const s1={id:uid(),name:'مصنع النور لملابس الأطفال',phone:'01001234567'};
  const s2={id:uid(),name:'الحاج سيد للعبايات',phone:'01112345678'};
  const s3={id:uid(),name:'أتيليه ريم للفساتين',phone:'01223456789'};
  const s4={id:uid(),name:'شركة الياسمين (حريمي)',phone:'01534567890'};
  const it=(name,cat,sup,cost,price,rent=0)=>({id:uid(),name,cat,supplierId:sup.id,cost,price,rent});
  const i=[it('بيجامة أطفال قطن','أطفال',s1,120,200),it('طقم خروج بناتي','أطفال',s1,260,420),it('روب بيتي حريمي','حريمي بيتي',s4,180,300),
    it('بيجامة حريمي شتوي','حريمي بيتي',s4,220,360),it('بلوزة خروج شيفون','حريمي خروج',s4,190,330),it('عباية كريب سادة','عبايات',s2,450,750),
    it('عباية مطرزة','عبايات',s2,700,1150),it('فستان زفاف ملكي','فساتين زفاف',s3,18000,30000,4500),it('فستان خطوبة سواريه','فساتين خطوبة',s3,6000,10000,1500),
    it('فستان سهرة ستان','فساتين حفلات',s3,2500,4200,800)];
  const P=(d,a,by='أحمد')=>({d:dayOff(d),a,by});
  const pu=(d,item,qty,mode,pays,n=0)=>({id:uid(),date:dayOff(d),supplierId:item.supplierId,itemId:item.id,qty,cost:item.cost,mode,n,pays,by:'أحمد'});
  const purchases=[pu(-40,i[0],20,'cash',[P(-40,2400)]),pu(-40,i[1],10,'cash',[P(-40,2600)]),pu(-35,i[2],12,'credit',[P(-35,1000)]),

/* ---------- money logic ---------- */
const item=id=>S.items.find(x=>x.id===id)||{name:'(صنف اتمسح)',cost:0,price:0,rent:0};
const sup=id=>S.suppliers.find(x=>x.id===id)||{name:'(مورد اتمسح)'};
const stock=id=>sum(S.purchases.filter(p=>p.itemId===id),p=>p.qty)-sum(S.sales.filter(p=>p.itemId===id),p=>p.qty);
const paidOf=r=>sum(r.pays||[],p=>p.a);
const totalOf=(coll,r)=>coll==='sales'?r.qty*r.price:coll==='purchases'?r.qty*r.cost:r.price;
const restOf=(coll,r)=>totalOf(coll,r)-paidOf(r);
const inP=d=>period==='all'||(d||'').slice(0,7)===today().slice(0,7);
const restPill=rest=>rest<=0?'<span class="pill good">تمام</span>':`<span class="pill bad">باقي ${money(rest)}</span>`;
function instInfo(p){
  if(p.mode!=='inst'||!p.n)return'';
  const per=totalOf('purchases',p)/p.n,done=Math.min(p.n,Math.floor(paidOf(p)/per+0.001));
  if(done>=p.n)return `${p.n} أقساط خلصت`;
  const due=addMonths(p.date,done+1),late=due<today();
  return `قسط ${money(per)} · دفعت ${done} من ${p.n} · القسط الجاي ${fmtDate(due)}${late?' <span class="pill bad">متأخر</span>':''}`;
}
function totals(){
  const sl=S.sales.filter(x=>inP(x.date)),rn=S.rentals.filter(x=>inP(x.from)),ex=S.expenses.filter(x=>inP(x.date)),pu=S.purchases.filter(x=>inP(x.date));
  const salesRev=sum(sl,x=>x.qty*x.price),salesCost=sum(sl,x=>x.qty*x.cost),rentRev=sum(rn,x=>x.price)+sum(rn,x=>x.status==='back'?x.depIn-x.depOut:0),exp=sum(ex,x=>x.amount);
  const cashIn=(S.capital||0)+sum(S.sales,paidOf)+sum(S.rentals,paidOf)+sum(S.rentals,x=>x.depIn||0);
  const cashOut=sum(S.purchases,paidOf)+sum(S.expenses,x=>x.amount)+sum(S.rentals,x=>x.depOut||0);
  return {salesRev,grossSales:salesRev-salesCost,rentRev,exp,net:salesRev-salesCost+rentRev-exp,purch:sum(pu,x=>x.qty*x.cost),cash:cashIn-cashOut,
    deposits:sum(S.rentals.filter(r=>r.status==='out'),r=>r.depIn-r.depOut),
    custOwe:sum(S.sales,x=>Math.max(0,restOf('sales',x)))+sum(S.rentals,x=>Math.max(0,restOf('rentals',x))),
    supOwe:sum(S.purchases,x=>Math.max(0,restOf('purchases',x))),ex};
}

function openForm(type,preset={},ctx){
  const F=FORMS[type];const need=F.need&&F.need();
  const names=[...new Set([...S.sales,...S.rentals].map(r=>r.customer).filter(Boolean))];
  const fld=f=>{const id='f_'+f.k;let inp;
    if(f.t==='select')inp=`<select id="${id}" name="${f.k}">${f.o().map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`;
    else inp=`<input id="${id}" name="${f.k}" type="${f.t==='number'?'text':f.t}" ${f.t==='number'?'inputmode="decimal"':''} ${f.list?'list="custNames"':''} autocomplete="off">`;
    return `<div class="field"><label for="${id}">${f.l}</label>${inp}</div>`};
  let html='',buf=[];const flush=()=>{if(buf.length){html+=`<div class="two">${buf.join('')}</div>`;buf=[]}};
  F.fields.forEach(f=>{if(f.half){buf.push(fld(f));if(buf.length===2)flush()}else{flush();html+=fld(f)}});flush();
  $('#sheetRoot').innerHTML=`<div class="sheet-bg" id="bg"><form class="sheet" id="frm" aria-label="${F.title}"><h2>${F.title}</h2>
   <datalist id="custNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
   ${need?`<p class="err">${need}</p><div class="btns"><button type="button" class="btn" id="cancel">رجوع</button></div>`:`${html}<div class="preview" id="pv" hidden></div><p class="err" id="err"></p>
   <div class="btns"><button class="btn pri" type="submit">حفظ</button><button type="button" class="btn" id="cancel">إلغاء</button></div>`}</form></div>`;
  const frm=$('#frm');const set=(k,v)=>{const e=frm.elements[k];if(e&&v!=null)e.value=v};
  $('#cancel').onclick=closeForm;$('#bg').onclick=e=>{if(e.target.id==='bg')closeForm()};
  if(need)return;
  F.fields.forEach(f=>{if(f.t==='date')set(f.k,today())});
  if(type==='rentals')set('to',dayOff(2));
  if(F.onItem&&frm.elements.itemId){if(preset.itemId)set('itemId',preset.itemId);F.onItem(item(frm.elements.itemId.value),set);
    frm.elements.itemId.addEventListener('change',()=>{F.onItem(item(frm.elements.itemId.value),set);upd()})}
  Object.entries(preset).forEach(([k,v])=>set(k,v));
  const read=()=>{const v={};F.fields.forEach(f=>{const r=frm.elements[f.k].value.trim();v[f.k]=f.t==='number'?(r===''?'':parseFloat(r.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g,''))):r});return v};
  const upd=()=>{const pv=$('#pv');const t=F.preview?F.preview(read(),ctx):'';pv.hidden=!t;pv.textContent=t};
  frm.addEventListener('input',upd);upd();
  frm.onsubmit=e=>{e.preventDefault();const v=read();const err=$('#err');
    for(const f of F.fields){
      if(f.t==='number'&&v[f.k]!==''&&(isNaN(v[f.k])||v[f.k]<0))return err.textContent=f.l+': رقم مش مظبوط';
      if(!f.opt&&(v[f.k]===''||(f.t==='number'&&!(v[f.k]>0))))return err.textContent='اكتب '+f.l.replace(/ ?\(.*\)/,'');}
    const c=F.check&&F.check(v,ctx);if(c)return err.textContent=c;
    const res=F.save(v,ctx);if(res&&res.then){err.textContent='لحظة…';res.then(([txt,goTab])=>{closeForm();tab=goTab||tab;render();toast(txt)}).catch(x=>{err.textContent=x.message||String(x)});return}
    const [txt,goTab]=res;logA(txt);save();closeForm();

const EXP_WORDS=[['كهرب','كهرباء ومياه'],['مياه','كهرباء ومياه'],['مرتب','مرتبات'],['ايجار المحل','إيجار المحل'],['نقل','نقل بضاعة'],['شنط','شنط وتغليف'],['تغليف','شنط وتغليف'],['دعاي','دعاية'],['اعلان','دعاية'],['صيان','صيانة']];
const norm=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة(?=\s|$)/g,'ه').replace(/(\d),(\d)/g,'$1$2').replace(/جنيه|ج\.م/g,' ').replace(/\s+/g,' ').trim();
function numAfter(t,words){for(const w of words){const m=t.match(new RegExp('(?:^|\\s)(?:و)?'+w+'\\s*(?:ب|بـ)?\\s*(\\d+(?:\\.\\d+)?)'));if(m)return +m[1]}return null}
function parseCmd(raw){
  const t=norm(raw);if(!t)return {err:'اكتب أو قول الأمر الأول'};
  let best=null,score=0;
  S.items.forEach(i=>{const ws=norm(i.name).split(' ').filter(w=>w.length>2);const s=ws.filter(w=>t.includes(w)).length/ws.length+(ws.filter(w=>t.includes(w)).length?0.01*ws.length:0);if(s>score){score=s;best=i}});
  const expHit=EXP_WORDS.find(([w])=>t.includes(w));
  let type=null;
  if(/(اجر|ايجار|حجز|حجزت)/.test(t)&&!/ايجار المحل/.test(t))type='rentals';
  else if(/(بعت|بيع|اتباع|باع)/.test(t))type='sales';
  else if(/(وارد|اشتريت|استلمت بضاعه|جالي من)/.test(t))type='purchases';
  else if(expHit||/(مصروف|صرفت)/.test(t))type='expenses';
  if(!type)return {err:'مش فاهم العملية. ابدأ بكلمة زي: بعت، أجّرت، حجز، مصروف، وارد.'};
  const total=numAfter(t,['بسعر','بمبلغ','ب','بـ','الايجار','سعره','سعرها']);
  let paid=numAfter(t,['دفعت','دفع','عربون','مقدم','العربون','دافعه','دافع']);
  const rest=numAfter(t,['متبقي','الباقي','باقي','فاضل']);
  const qm=t.match(/(\d+)\s*(?:قطعه|قطع|حته|حتت)/)||t.match(/(?:بعت|بيع)\s*(\d+)\s/);const qty=qm?+qm[1]:1;
  if(paid==null&&rest!=null&&total!=null)paid=(type==='sales'?total*qty:total)-rest;
  raw=raw.replace(/لل?عروس[ةه]\s*/,'للعميلة العروسة ');
  const cm=raw.match(/(?:للعميله|للعميلة|للعميل|العميله|العميلة|العميل|لـ|اسمها|اسمه)\s*([^\s\d،,.]+(?:\s(?!ب|بـ|بسعر|و|دفع|دفعت)[^\s\d،,.]+)?)/)||raw.match(/(?:^|\s)ل(?!مدة|مده)([^\s\d،,.]{3,}(?:\s(?:محمد|احمد|أحمد|علي|حسن|محمود|خالد|[^\s\d،,.]{3,}(?=\s|$)))?)/);
  let customer=cm?cm[1].trim():'';customer=customer.replace(/\s(ب|بـ|بسعر|دفع.*|و.*)$/,'');
  if(type==='expenses'){const amount=numAfter(t,['مصروف\\s*[^\\d]*','صرفت','ب','بـ'])||(t.match(/(\d+)/)||[])[1];
    return {type,preset:{type:expHit?expHit[1]:'أخرى',amount:amount||'',note:raw.trim()}};}
  if(!best)return {err:'مش لاقي الصنف ده في الأصناف. قول اسم الصنف زي ما هو متسجل.'};
  if(type==='rentals'){if(!best.rent){const d=S.items.find(i=>i.rent&&norm(i.name).split(' ').some(w=>w.length>2&&t.includes(w)));if(d)best=d;else return {err:'الصنف ده مش متسجل كفستان إيجار'}}
    return {type,preset:{itemId:best.id,customer,price:total??best.rent,paid:paid??''}};}
  if(type==='sales')return {type,preset:{itemId:best.id,customer,qty,price:total??best.price,paid:paid??''}};
  return {type,preset:{itemId:best.id,qty,cost:total??best.cost,paid:paid??''}};
}

/* ---------- crypto: shop data is locked with a shop key; each user's copy of the key is locked with their own password ---------- */
const CR={
  b64:b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)},
  unb64:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
  async derive(pw,uid){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('atelier-logy:'+uid),iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
  imp:raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt']),
  async newKey(){return CR.imp(crypto.getRandomValues(new Uint8Array(32)))},
  async exp(key){return CR.b64(await crypto.subtle.exportKey('raw',key))},
  async enc(key,text){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));return {iv:CR.b64(iv),e:CR.b64(c)}},
  async dec(key,d){const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:CR.unb64(d.iv)},key,CR.unb64(d.e));return new TextDecoder().decode(t)},
};

const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};

  'auth/email-already-in-use':'اسم الدخول ده متاخد، اختار اسم تاني','auth/weak-password':'الباسورد لازم 6 حروف أو أرقام على الأقل','auth/network-request-failed':'مفيش نت. لازم نت أول مرة',

  <div class="field"><label for="g_user">اسم الدخول${mode==='setup'?' (ممكن إيميلك، علشان لو نسيت الباسورد)':''}</label><input id="g_user" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
  <div class="field"><label for="g_pw">الباسورد</label><input id="g_pw" type="password" autocomplete="${mode==='setup'?'new-password':'current-password'}"></div>
  ${mode==='setup'?'<div class="field"><label for="g_pw2">اكتب الباسورد تاني</label><input id="g_pw2" type="password" autocomplete="new-password"></div>':''}
  <div id="g_extra"></div><p class="err" id="g_err">${esc(msg||'')}</p>
  <button class="btn pri" type="submit" style="padding:11px;font-size:16px">${mode==='setup'?'جهّز المحل':'دخول'}</button>
  ${mode==='setup'?'<button class="link" type="button" id="g_switch">عندي حساب، رجّعني للدخول</button>':`<button class="link" type="button" id="g_switch">أول مرة؟ جهّز المحل (للمدير)</button><button class="link" type="button" id="g_forgot">نسيت الباسورد</button>`}</form>`;
  $('#g_switch').onclick=()=>{g.dataset.mode=mode==='setup'?'login':'setup';showGate()};
  const err=$('#g_err');
  const fg=$('#g_forgot');if(fg)fg.onclick=async()=>{const u=$('#g_user').value.trim();
    if(!u.includes('@')){err.textContent='البياع: كلّم المدير يعملك حساب جديد. المدير: اكتب إيميلك في اسم الدخول ودوس تاني.';return}
    try{await SYNC.init();SYNC.auth.languageCode='ar';await SYNC.auth.sendPasswordResetEmail(u);err.textContent='اتبعتلك لينك على الإيميل. بعد ما تغيّر الباسورد، ادخل وهيطلب منك كود الاسترجاع.'}catch(e){err.textContent=fbErr(e)}};
  $('#gateForm').onsubmit=async e=>{e.preventDefault();err.textContent='لحظة…';
    const user=$('#g_user').value.trim(),pw=$('#g_pw').value;
    try{
      if(g.dataset.code){const info=JSON.parse(g.dataset.code);info.pw=pw;await SYNC.useCode(info,$('#g_code').value);delete g.dataset.code;return enterApp()}
      if(!user||!pw)throw new Error('اكتب اسم الدخول والباسورد');
      if(mode==='setup'){const name=$('#g_name').value.trim();if(!name)throw new Error('اكتب اسمك');if(pw.length<6)throw new Error('الباسورد لازم 6 حروف أو أرقام على الأقل');if(pw!==$('#g_pw2').value)throw new Error('الباسورد مش زي بعضه');
        const raw=await SYNC.setup(name,user,pw);
        g.innerHTML=`<div class="box"><img src="logo.jpg" alt="" width="150" height="150"><h2>المحل اتجهّز</h2><p class="hint">ده <b>كود الاسترجاع</b>. لو نسيت الباسورد في يوم، الكود ده هو اللي هيفتح بيانات المحل. اكتبه في ورقة وشيله في مكان أمان، وما تبعتهوش لحد.</p><div class="code">${esc(raw)}</div><button class="btn" id="g_copy">انسخ الكود</button><button class="btn pri" id="g_go" style="padding:11px;font-size:16px">كتبته، ادخل على التطبيق</button></div>`;
        $('#g_copy').onclick=()=>navigator.clipboard.writeText(raw).then(()=>toast('اتنسخ'),()=>{});$('#g_go').onclick=enterApp;return}
      const r=await SYNC.login(user,pw);
      if(r&&r.needCode){g.dataset.code=JSON.stringify({uid:r.uid,m:r.m});$('#g_extra').innerHTML='<div class="field"><label for="g_code">الباسورد اتغيّر. اكتب كود الاسترجاع علشان تفتح بيانات المحل</label><input id="g_code" autocapitalize="off" spellcheck="false" dir="ltr"></div>';err.textContent='';return}
      enterApp();
    }catch(x){err.textContent=fbErr(x)}};
}
function enterApp(){const g=$('#gate');if(g)g.remove();tab='home';render();SYNC.start()}

/* ---------- backups on this device ---------- */
function saveFile(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function downloadBackup(auto){saveFile(`atelier-logy-${today()}.json`,new Blob([JSON.stringify({app:'atelier-logy',v:1,at:new Date().toISOString(),data:S},null,1)],{type:'application/json'}));ls.set(RK+'lastbak',today());if(!auto)toast('اتحفظت النسخة في فولدر التنزيلات')}
function autoBackup(force){if(ls.get(RK+'autobak')!=='1')return;if(!force&&ls.get(RK+'lastbak')===today())return;downloadBackup(true);toast('اتحفظت نسخة النهارده على الجهاز ده (فولدر التنزيلات)')}
function downloadCSV(){
  const rows=[['النوع','التاريخ','الاسم','الصنف','العدد','الإجمالي','المدفوع','الباقي','طريقة الدفع','سجّلها']];
  S.sales.forEach(x=>rows.push(['بيع',x.date,x.customer,item(x.itemId).name,x.qty,totalOf('sales',x),paidOf(x),restOf('sales',x),'',x.by]));
  S.rentals.forEach(x=>rows.push(['إيجار',x.from,x.customer,item(x.itemId).name,1,x.price,paidOf(x),restOf('rentals',x),'تأمين '+(x.depIn||0),x.by]));
  S.purchases.forEach(x=>rows.push(['وارد',x.date,sup(x.supplierId).name,item(x.itemId).name,x.qty,totalOf('purchases',x),paidOf(x),restOf('purchases',x),MODES[x.mode],x.by]));
  S.expenses.forEach(x=>rows.push(['مصروف',x.date,x.type,x.note||'','',x.amount,x.amount,0,'',x.by]));
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  saveFile(`atelier-logy-${today()}.csv`,new Blob([csv],{type:'text/csv'}));toast('اتحفظ ملف Excel في التنزيلات')}
function restoreFrom(file){if(!file)return;const msg=$('#restoreMsg');const fr=new FileReader();
  fr.onload=()=>{let j;try{j=JSON.parse(fr.result)}catch(e){msg.textContent='الملف ده مش نسخة من التطبيق';return}
    const d=j&&j.data;if(!d||!Array.isArray(d.sales)){msg.textContent='الملف ده مش نسخة من التطبيق';return}
    const n=COLLS.reduce((a,c)=>a+(d[c]||[]).length,0);
    msg.innerHTML=`النسخة دي من ${esc((j.at||'').slice(0,10))} وفيها ${n} عملية. اللي ناقص بس هيتضاف، ومفيش حاجة هتتمسح. <button class="btn pri" id="doRestore">رجّعها</button>`;
    $('#doRestore').onclick=()=>{let added=0;COLLS.forEach(c=>(d[c]||[]).forEach(r=>{if(!r.id)r.id=uid();if(!S[c].some(x=>x.id===r.id)){S[c].push(r);added++}}));logA(`رجّع ${added} عملية من نسخة احتياطية`);save();render();toast(`اترجّعت ${added} عملية`)}};
  fr.readAsText(file)}

/* ---------- start ---------- */
function boot(){
  if(REAL){$('#footNote').textContent='بيانات المحل متشفّرة ومتزامنة بين كل الأجهزة.';
    const m=ls.get(RK+'msg');if(m)ls.set(RK+'msg','');
    if(!SESSION||!ls.get(RK+'key_'+SESSION.uid)){SESSION=null;render();showGate(m);return}
    render();SYNC.start();
  }else{render();setTimeout(autoBackup,2500)}
  syncUI();
}

/* ---------- render & events ---------- */
function render(){
  if(!tabsFor().some(([k])=>k===tab))tab=tabsFor()[0][0];
  ls.set(KEY+'_tab',tab);
  $('#demoWho').hidden=REAL;$('#realWho').hidden=!REAL;if(REAL&&SESSION)$('#realWho').textContent=me().name+' · '+me().role;
  if(!REAL)$('#meSel').innerHTML=S.users.map(u=>`<option value="${u.id}" ${u.id===me().id?'selected':''}>${esc(u.name)} (${u.role})</option>`).join('');
  $('#tabs').innerHTML=tabsFor().map(([k,l])=>`<button class="tab" data-tab="${k}" aria-current="${k===tab}">${l}</button>`).join('');
  $('#view').innerHTML=VIEWS[tab]();
  const labels={home:'+ بيع',customers:'+ بيع',items:'+ صنف',purchases:'+ وارد',sales:'+ بيع',rentals:'+ حجز فستان',expenses:'+ مصروف',suppliers:'+ مورد'};
  $('#fab').hidden=!labels[tab];$('#fab').textContent=labels[tab]||'';
  const q=$('#itemQ');if(q){q.oninput=()=>{itemQ=q.value;const pos=q.selectionStart;render();const n=$('#itemQ');n.focus();n.setSelectionRange(pos,pos)};$('#itemCat').onchange=e=>{itemCat=e.target.value;render()}}
  const rb=$('#resetBtn');if(rb){rb.onclick=()=>{if(!rb.classList.contains('armed')){rb.classList.add('armed');rb.textContent='متأكد؟ كل حاجة هتتمسح. دوس تاني';return}
    const u=me();S={v:2,demo:false,capital:0,users:[{...u,role:'مدير'}],suppliers:[],items:[],purchases:[],sales:[],rentals:[],expenses:[],log:[]};meId=u.id;ls.set(KEY+'_me',meId);save();tab='suppliers';render();toast('اتمسحت الأمثلة. ابدأ بإضافة مورد.')};
    $('#sampleBtn').onclick=()=>{S=seed();meId='u1';ls.set(KEY+'_me',meId);save();tab='home';render()}}
  const ab=$('#autoBak');if(ab){ab.onchange=()=>{ls.set(RK+'autobak',ab.checked?'1':'0');if(ab.checked)autoBackup(true)};$('#bakNow').onclick=()=>downloadBackup();$('#csvNow').onclick=downloadCSV;
    const rf=$('#restoreFile');if(rf)rf.onchange=()=>restoreFrom(rf.files[0])}
  const lo=$('#logoutBtn');if(lo)lo.onclick=()=>{if(!lo.classList.contains('armed')){lo.classList.add('armed');lo.textContent=SYNC.pending?'فيه حاجات لسه ما اترفعتش! دوس تاني للخروج':'متأكد؟ دوس تاني';return}SYNC.logout()};
  const sc=$('#showCode');if(sc)sc.onclick=async()=>{$('#codeBox').innerHTML=`<p class="hint">الكود ده بيفتح بيانات المحل لو المدير نسي الباسورد. اكتبه في ورقة وشيله في مكان أمان، وما تبعتهوش لحد.</p><div class="code">${esc(await SYNC.recoveryCode())}</div>`};
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){tab=d.tab;render();scrollTo(0,0);return}
  if(d.period){period=d.period;render();return}
  if(d.loguser!==undefined){logUser=d.loguser;render();return}
  if(d.look){const[k,v]=d.look.split(':');look[k]=v;applyLook();render();return}
  if(d.open){openForm(d.open,d.open==='capital'?{amount:S.capital}:{});return}
  if(d.pay){const[coll,id]=d.pay.split(':');const r=S[coll].find(x=>x.id===id);if(r)openForm('pay',{amount:restOf(coll,r)},{coll,r});return}
  if(d.suppay){const rest=sum(S.purchases.filter(p=>p.supplierId===d.suppay),p=>restOf('purchases',p));openForm('suppay',{amount:rest},d.suppay);return}
  if(d.hand){const r=S.rentals.find(x=>x.id===d.hand);openForm('hand',{amount:restOf('rentals',r),dep:r.deposit},r);return}
  if(d.back){const r=S.rentals.find(x=>x.id===d.back);openForm('back',{dep:r.depIn},r);return}
  if(d.active){const[id,on]=d.active.split(':');SYNC.setActive(id,on==='1');return}
  if(d.deluser){S.users=S.users.filter(u=>u.id!==d.deluser);save();render();return}
  if(d.del){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='متأكد؟ دوس تاني';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='حذف'}},3000);return}
    const [coll,id]=d.del.split(':');
    if(coll==='items'&&(S.purchases.some(p=>p.itemId===id)||S.sales.some(p=>p.itemId===id)||S.rentals.some(p=>p.itemId===id))){b.textContent='الصنف ليه حركة';return}
    if(coll==='suppliers'&&(S.items.some(p=>p.supplierId===id)||S.purchases.some(p=>p.supplierId===id))){b.textContent='المورد ليه أصناف';return}
    S[coll]=S[coll].filter(x=>x.id!==id);logA('حذف من '+(ALL_TABS.find(t=>t[0]===coll)||['',coll])[1]);save();render();return}
});
if(!REAL)$('#meSel').onchange=e=>{meId=e.target.value;ls.set(KEY+'_me',meId);render();toast('دخلت باسم '+me().name)};
$('#fab').onclick=()=>openForm(['home','customers'].includes(tab)?'sales':tab);
$('#voiceBtn').onclick=openVoice;
function syncUI(){const on=navigator.onLine,s=$('#sync');let t,off=false;
  if(!on){t='أوفلاين · هيتبعت لما النت يرجع';off=true}
  else if(REAL&&!SYNC.live){t='بيتصل…';off=true}
  else if(REAL&&SYNC.pending){t='بيرفع…';off=true}
  else t=REAL?'متزامن مع كل الأجهزة':'أونلاين';
  s.className='sync'+(off?' off':'');s.textContent=t}
addEventListener('online',()=>{syncUI();if(REAL&&SESSION&&!SYNC.ready)SYNC.start()});addEventListener('offline',syncUI);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
boot();
(()=>{const sp=document.getElementById('splash');const bye=()=>{sp.classList.add('bye');setTimeout(()=>sp.remove(),600)};sp.onclick=bye;setTimeout(bye,1800)})();
</script>
