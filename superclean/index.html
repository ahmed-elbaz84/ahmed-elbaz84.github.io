<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0089b0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Super Clean">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Super Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a tidy shop-counter app, calm and quick to use with one hand.
   IDEA: the cleaning-shop sales book: stock shelf, receipt pad, cash drawer.
   PICTURE: an aqua band of soap bubbles carrying the net profit; the working table/receipt is the rest.
   COLOUR and TYPE: clean aqua dominant, deep sea ink, lemon accent; Cairo throughout.
   LAYOUT: sticky top bar, one column of cards, bottom tab bar with a raised invoice button. */
:root{color-scheme:light dark;--bg:light-dark(#eef7fa,#08141a);--card:light-dark(#ffffff,#10222b);--ink:light-dark(#0b2733,#e4f3f8);--mut:light-dark(#587280,#8eaab5);--line:light-dark(#d5e8ee,#1f3843);--pri:light-dark(#0089b0,#2bb6da);--pri2:light-dark(#006a8a,#8fe0f5);--on:#ffffff;--acc:#ffd23f;--ok:light-dark(#0b8048,#4ad18a);--bad:light-dark(#c3352d,#ff7f75);--soft:light-dark(#e1f3f9,#12303b);--warn:light-dark(#fff4cc,#3a3210)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,Tahoma,Arial,sans-serif;overflow-x:clip;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(4vw,14px) 10px;background:var(--pri);color:var(--on)}
.top .logo{width:34px;height:34px;flex:none}
.top h1{font-size:20px;font-weight:800;letter-spacing:0}
.top small{display:block;font-size:12px;opacity:.85;font-weight:600}
.top .sp{flex:1}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.ib svg{width:22px;height:22px}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd23f;margin-inline-end:5px;vertical-align:middle}
.sync.ok{background:#7dffb5}.sync.err{background:#ff8a80}
main{max-width:980px;margin:0 auto}
.band{padding:18px max(4vw,14px)}
.hero{background:var(--pri);color:#fff;position:relative;overflow:hidden;padding-bottom:26px}
.hero .bub{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(.bub){position:relative}
.hero .lbl{font-weight:600;opacity:.9}
.hero .big{font-size:clamp(34px,10vw,52px);font-weight:800;line-height:1.05;margin:4px 0 6px;white-space:nowrap}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600;opacity:.95}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{min-height:38px;padding:4px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.hero .chip.on{background:#fff;color:var(--pri2);border-color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi span{display:block;color:var(--mut);font-size:13px;font-weight:600}
.kpi b{font-size:21px;font-weight:800;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.card h2,.sec{font-size:18px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec .sp{flex:1}
.mut{color:var(--mut)}
.bars .r{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.bars .t{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--pri);border-radius:6px}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.a{background:var(--acc);border-color:var(--acc);color:#3a2e00}
.btn.d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:38px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;margin-bottom:10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;font-size:14px}
.tbl th{background:var(--soft);font-weight:700;color:var(--pri2);position:sticky;top:0}
.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums}
.tbl td.nm{font-weight:700;white-space:normal;min-width:8em}
.tbl td.nt{white-space:normal;min-width:9em;color:var(--mut);font-size:13px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:active{background:var(--soft)}
.tbl tr.low td.q{color:var(--bad);font-weight:800}
.tbl tr.off td{opacity:.45}
.tbl tfoot td{font-weight:800;background:var(--soft)}
.tbl .first{position:sticky;inset-inline-start:0;background:var(--card);z-index:1}
.tbl th.first{background:var(--soft)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--pri2)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.list .it{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border:0}
.list .it .grow{flex:1}
.list .it b{display:block}
.list .it small{color:var(--mut);font-size:13px}
.list .it .amt{text-align:end;font-weight:800;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 14px;cursor:pointer;text-align:start;min-height:110px}
.tile svg{width:30px;height:30px;color:var(--pri)}
.tile b{display:block;font-size:17px;margin-top:6px}
.tile small{color:var(--mut)}
/* forms */
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:3px}
.fld input,.fld select,.fld textarea,.in{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;font-size:16px}
.fld textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.chk input{width:22px;height:22px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.acts .grow{flex:1}
.note{background:var(--warn);border-radius:12px;padding:8px 12px;font-size:14px;margin:6px 0}
.box{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:12px 0}
.box h4{margin:0 0 8px;font-size:15px}
.margin{font-size:14px;font-weight:700;margin:-2px 0 10px}
/* invoice editor */
.line{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.line select{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:6px 10px;font-size:16px;font-weight:700}
.lnums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 44px;gap:8px;align-items:end;margin-top:8px}
.lnums label span{display:block;font-size:12px;color:var(--mut);font-weight:700}
.lnums input{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:6px 10px;font-size:16px;text-align:center}
.lt{min-height:44px;display:flex;flex-direction:column;justify-content:center;font-weight:800;white-space:nowrap;font-size:15px}
.lt small{font-size:11px;color:var(--mut);font-weight:700}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--bad);font-size:22px;cursor:pointer}
.lwarn{font-size:13px;color:var(--bad);font-weight:700;margin-top:4px}
.lwarn:empty{display:none}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:15px}
.tot .in{min-height:42px;width:9em;text-align:center}
.tot .grand{font-size:22px;font-weight:800;color:var(--pri2)}
.tot hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.stick{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--bg);padding:10px 0;display:flex;gap:8px;z-index:3}
.stick .btn{flex:1}
body.hp .pf{filter:blur(7px);user-select:none}
/* tabs */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:4px 4px env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--pri)}
.tabs .fab span.c{width:54px;height:54px;border-radius:50%;background:var(--acc);color:#3a2e00;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(0,60,80,.25);border:4px solid var(--card)}
.tabs .fab span.c svg{width:26px;height:26px}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,20,28,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px max(4vw,16px) calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet h3{font-size:20px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sheet h3 .sp{flex:1}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
/* printed invoice (fixed light colours) */
#pdfbox{position:fixed;left:-12000px;top:0}
.paper{width:720px;background:#fff;color:#14232b;font-family:Cairo,Tahoma,sans-serif;padding:34px 34px 26px;direction:rtl;font-size:15px;line-height:1.6}
.paper .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #0089b0;padding-bottom:14px;gap:14px}
.paper .brand{display:flex;align-items:center;gap:12px}
.paper .brand svg{width:58px;height:58px}
.paper .brand b{display:block;font-size:28px;font-weight:800;color:#006a8a;line-height:1.1}
.paper .brand small{color:#587280;font-size:14px}
.paper .pmeta{text-align:left;display:flex;flex-direction:column;font-size:14px}
.paper .pmeta b{font-size:20px;color:#14232b}
.paper .pcust{margin:14px 0;background:#eef7fa;border-radius:10px;padding:8px 14px}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper th{background:#0089b0;color:#fff;padding:8px;font-weight:700;text-align:start}
.paper td{padding:8px;border-bottom:1px solid #d5e8ee}
.paper .n{text-align:left;white-space:nowrap}
.paper .ptot{margin:14px 0 0 0;width:300px;margin-inline-start:auto}
.paper .ptot div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #d5e8ee}
.paper .ptot .done{color:#1e7a3c;font-weight:800;border-bottom:0}
.paper .ptot .g{font-size:20px;font-weight:800;color:#006a8a;border-bottom:3px solid #ffd23f}
.paper .pnote{margin-top:14px;font-size:14px;color:#3c5561}
.paper .pfoot{margin-top:26px;border-top:1px solid #d5e8ee;padding-top:12px;text-align:center;font-size:14px;color:#3c5561}
.paper .pfoot b{color:#006a8a;font-size:17px}
.prev{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px}
.prev .paper{zoom:.5;padding:24px}
@media(min-width:560px){.prev .paper{zoom:.75}}

/* ---- compact, professional sizing (v2) ---- */
body{font-size:14.5px;line-height:1.5;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.top{padding:calc(8px + env(safe-area-inset-top)) max(4vw,14px) 8px;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.top .logo{width:26px;height:26px}.top h1{font-size:16px}.top small{font-size:11px;font-weight:500}
.ib{width:36px;height:36px;border-radius:10px}.ib svg{width:19px;height:19px}
.band{padding:12px max(4vw,14px)}
.hero{padding-bottom:16px}
.hero .lbl{font-size:13px;font-weight:500}
.hero .big{font-size:clamp(24px,7vw,32px);margin:2px 0 4px}
.hero .sub{font-size:12.5px;font-weight:500;gap:2px 14px}
.chips{gap:6px;margin-bottom:10px}
.chip{min-height:32px;padding:2px 12px;font-size:12.5px;font-weight:600}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{border-radius:12px;padding:9px 12px}
.kpi span{font-size:11.5px;font-weight:500}
.kpi b{font-size:16px;font-weight:700}
.card{border-radius:14px;padding:12px;margin-bottom:10px}
.card h2,.sec{font-size:15px;font-weight:700;margin-bottom:8px}
.bars .r{font-size:12.5px;margin:5px 0}.bars .t{height:8px}
.btn{min-height:40px;padding:6px 14px;border-radius:10px;font-size:14px;font-weight:600}
.btn.sm{min-height:34px;padding:3px 10px;font-size:12.5px}
.search{height:42px;border-radius:10px;margin-bottom:8px}
.tbl th,.tbl td{padding:8px;font-size:13px}
.tbl th{font-weight:600}
.list .it{padding:9px 2px;gap:8px}
.list .it b{font-size:14px;font-weight:600}
.list .it small{font-size:12px}
.list .it .amt{font-size:14px;font-weight:700}
.tag{font-size:11px;font-weight:600}
.empty{padding:18px 10px;font-size:13px}
.tiles{gap:10px}.tile{border-radius:14px;padding:14px 12px;min-height:88px}.tile svg{width:24px;height:24px}.tile b{font-size:14.5px;font-weight:700}.tile small{font-size:12px}
.fld{margin-bottom:8px}.fld>span{font-size:12px;font-weight:600}
.fld input,.fld select,.fld textarea,.in{min-height:42px;border-radius:10px;padding:6px 10px}
.line{border-radius:12px;padding:8px;margin-bottom:8px}
.line select{min-height:42px;border-radius:10px;font-size:15px;font-weight:600}
.lnums{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 40px;gap:6px;margin-top:6px}
.lnums label span{font-size:11px;font-weight:600}
.lnums input{min-height:40px;border-radius:10px}
.lt{min-height:40px;font-size:14px;font-weight:700}
.x{width:40px;height:40px;border-radius:10px;font-size:20px}
.tot{font-size:13.5px;gap:4px 10px}.tot .in{min-height:38px;width:8em}.tot .grand{font-size:17px;font-weight:700}
.stick{bottom:calc(64px + env(safe-area-inset-bottom));padding:8px 0}
.tabs button{min-height:54px;font-size:11px;font-weight:600}.tabs button svg{width:21px;height:21px}
.tabs .fab span.c{width:46px;height:46px;margin-top:-20px;border-width:3px}.tabs .fab span.c svg{width:22px;height:22px}
.note{font-size:13px;padding:8px 10px}
.margin{font-size:13px}
.chk{font-weight:600;font-size:14px}
/* sheet: scroll inside it from anywhere, never the page behind */
.modal{height:100dvh}
.sheet{max-height:calc(100dvh - 16px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-radius:18px 18px 0 0;padding:12px max(4vw,14px) calc(16px + env(safe-area-inset-bottom))}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:10px}
body.lock{overflow:hidden}
/* while typing: hide the tab bar so the keyboard leaves room */
body.kb .tabs{display:none}
body.kb{padding-bottom:0}
body.kb .stick{bottom:0}
.itbl td.nm{min-width:7.5em}.itbl td.nm b{display:block;font-weight:600;cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--mut) 60%,transparent);text-underline-offset:3px}.itbl td.nm small{display:block;color:var(--mut);font-size:11.5px}
.itbl tbody tr{cursor:default}.itbl tbody tr:active{background:none}
.itbl tr.sel td{background:color-mix(in srgb,var(--pri) 10%,var(--card))}
.itbl input{width:62px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:16px;padding:2px 4px}
.itbl .ip{width:70px;border-style:dashed}
.itbl .iqt{border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.itbl td{vertical-align:middle;padding:6px}
.itbl .itot{font-weight:700;display:block;min-width:3.5em}
.itbl .irm{display:none;margin:2px auto 0;width:30px;height:26px;border-radius:8px;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);background:none;color:var(--bad);font-size:16px;line-height:1;cursor:pointer}
.itbl .irm{display:block}.itbl .irm.add{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.itbl .lwarn{font-size:11px;margin:0}
.tbl th,.tbl td,.tbl td.n,.tbl th.n{text-align:center}
.tbl th.first,.tbl td.first,.tbl td.nm,.itbl th:first-child,.itbl td.nm,.tbl td.nt{text-align:start}
.itbl input{margin-inline:auto;display:block}
.paper th,.paper td,.paper .n{text-align:center}
.paper th:nth-child(2),.paper td:nth-child(2){text-align:start}
.updbar{position:fixed;inset-inline:10px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}.updbar span{flex:1}
[data-inst][hidden],[data-instnote][hidden]{display:none!important}
.qrbox{background:#fff;border-radius:14px;padding:8px;width:min(230px,66vw);margin:10px auto}.qrbox svg{display:block;width:100%;height:auto}
.news{margin:8px 0 0;padding-inline-start:20px}.news li{margin:4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}

/* Everything is saved on this phone first (localStorage), always, even when signed in, so nothing disappears if the net is bad.

function saveLocal(){if(!jset(LS,S))toast('مساحة الحفظ على الموبايل مليانة')}
function readLocal(){return jget(LS,null)}
function loadLocal(){const d=readLocal();if(d){COLS.forEach(c=>S[c]=d[c]||{});return}

const ref=(c,id)=>fs.collection('users').doc(user.uid).collection('sc_'+c).doc(id);
function queue(c,id,o){saveLocal();if(!user&&!owner())return;outbox[c+'|'+id]={o,t:Date.now()+Math.random()};jset(OB,outbox);flush()}

function fail(e){toast('لم يتم الحفظ على الحساب: '+((e&&e.code)||'حاول مرة أخرى'))}
function flush(){
  if(!user||!synced||!fs)return refreshSync();
  for(const [k,e] of Object.entries(outbox)){const key=k+'#'+e.t;if(inflight.has(key))continue;inflight.add(key);
    const i=k.indexOf('|'),c=k.slice(0,i),id=k.slice(i+1),u=user;
    (e.o?ref(c,id).set(e.o):ref(c,id).delete()).then(()=>{if(outbox[k]&&outbox[k].t===e.t&&user===u){delete outbox[k];jset(OB,outbox)}refreshSync()})

/* bring this account's server copy and this phone's copy together; nothing is cleared until the server has answered */
async function merge(u){
  const base=fs.collection('users').doc(u.uid);
  const res=await Promise.all(COLS.map(c=>base.collection('sc_'+c).get({source:'server'})));
  const srv={};COLS.forEach((c,k)=>{srv[c]={};res[k].docs.forEach(d=>{srv[c][d.id]=d.data()})});
  const own=owner(),local=readLocal()||{},push=new Set();
  const had=['items','invoices','customers'].some(c=>Object.keys(srv[c]).length),wasFresh=fresh();
  if(had)try{localStorage.removeItem('sc-fresh')}catch(e){}
  if(!own){/* typed before signing in: add it to the account; a server record only wins if it was edited later, or is still an untouched blank */
    for(const c of COLS){if(c==='settings'&&had&&wasFresh)continue;for(const [id,r] of Object.entries(local[c]||{})){const v=srv[c][id];
      if(!v||num(r._t)>num(v._t)||(!v._t&&blank(c,v)&&!blank(c,r))){srv[c][id]={...r,id};push.add(c+'|'+id)}}}}
  if(!own||own===u.uid)for(const [k,e] of Object.entries(outbox)){const i=k.indexOf('|'),c=k.slice(0,i),id=k.slice(i+1);if(!srv[c])continue;
    if(e.o){const v=srv[c][id];if(!v||num(e.o._t)>=num(v._t))srv[c][id]=e.o}else delete srv[c][id]}
  else outbox={};
  if(user!==u)return false;
  COLS.forEach(c=>S[c]=srv[c]);
  const t=Date.now();push.forEach(k=>{if(!outbox[k]){const i=k.indexOf('|');outbox[k]={o:S[k.slice(0,i)][k.slice(i+1)],t:t+Math.random()}}});
  jset(OB,outbox);setOwner(u.uid);saveLocal();return true}
async function trySync(){
  if(!user||synced||syncing||!fs)return;syncing=true;const u=user;
  try{if(!await merge(u))return;synced=true;render(true);
    COLS.forEach(c=>unsubs.push(fs.collection('users').doc(u.uid).collection('sc_'+c).onSnapshot({includeMetadataChanges:true},snap=>{
      if(snap.metadata.fromCache||user!==u)return;
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
      for(const [k,e] of Object.entries(outbox)){const i=k.indexOf('|');if(k.slice(0,i)!==c)continue;const id=k.slice(i+1);if(e.o)o[id]=e.o;else delete o[id]}
      S[c]=o;saveLocal();refreshSync();render(true)},()=>setSync('err'))));
    flush();setTimeout(autoBackup,8000);
  }catch(e){if(user===u)setSync(e&&e.code==='permission-denied'?'err':'slow')}
  finally{syncing=false}
}
async function onUser(u){
  unsubs.forEach(f=>f());unsubs=[];synced=false;
  if(!u){user=null;try{localStorage.removeItem('sc-acct')}catch(e){}loadLocal();setSync('local');render();return}
  user=u;try{localStorage.setItem('sc-acct',u.email||'1')}catch(e){}
  const own=owner();
  if(!own||own===u.uid)loadLocal();else COLS.forEach(c=>S[c]={});
  setSync('loading');render();

  await trySync();clearTimeout(t);
}

  const iv=list('invoices').filter(i=>inP(i.date)),ex=list('expenses').filter(e=>inP(e.date));
  const sales=sum(iv,i=>i.total),prof=sum(iv,i=>i.profit),exp=sum(ex,e=>e.amount),net=prof-exp;
  const its=items(),low=its.filter(i=>i.active!==false&&num(i.qty)<=num(i.min));
  const debts=sum(list('invoices'),due),sv=sum(its,i=>num(i.qty)*num(i.cost)),ssv=sum(its,i=>num(i.qty)*num(i.sell));
  const agg={};iv.forEach(i=>(i.lines||[]).forEach(l=>{const k=l.name;agg[k]=agg[k]||{q:0,v:0,u:l.unit};agg[k].q+=num(l.qty);agg[k].v+=num(l.qty)*num(l.price)}));
  const top=Object.entries(agg).sort((a,b)=>b[1].v-a[1].v).slice(0,6),mx=top[0]?top[0][1].v:1;
  const pl={today:'اليوم',month:'هذا الشهر',all:'كل الفترات'}[period];
  return `<section class="band hero">
  <svg class="bub" viewBox="0 0 400 220" preserveAspectRatio="xMinYMid slice" aria-hidden="true">${[[70,40,34],[28,112,22],[100,160,46],[150,58,14],[40,195,18],[180,178,10],[124,96,8]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><path d="M${x-r*.5} ${y-r*.2}a${r*.55} ${r*.55} 0 0 1 ${r*.35}-${r*.35}" stroke="rgba(255,255,255,.7)" stroke-width="2" fill="none" stroke-linecap="round"/>`).join('')}</svg>
  <div class="chips">${['today','month','all'].map(p=>`<button class="chip ${p===period?'on':''}" data-act="period:${p}">${{today:'اليوم',month:'الشهر',all:'الكل'}[p]}</button>`).join('')}</div>
  <div class="lbl">صافي المكسب — ${pl}</div>
  <div class="big pf">${egp(net)}</div>
  <div class="sub"><span>المبيعات ${egp(sales)}</span><span class="pf">مكسب الفواتير ${egp(prof)}</span><span>المصروفات ${egp(exp)}</span></div>
  </section>
  ${!user?`<section class="band" style="padding-bottom:0"><div class="note" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1">البيانات على الموبايل ده بس. ادخل بحساب عشان تتزامن مع موبايل تاني.</span><button class="btn sm" data-act="go:settings">دخول</button></div></section>`:''}
  <section class="band">
  <div class="kpis">
    <div class="kpi"><span>عدد الفواتير</span><b>${iv.length}</b></div>
    <div class="kpi"><span>اتحصّل نقدي</span><b>${egp(sum(iv.filter(i=>(i.pay||'نقدي')==='نقدي'),i=>i.paid))}</b></div>
    <div class="kpi"><span>اتحصّل تحويل</span><b>${egp(sum(iv.filter(i=>i.pay==='تحويل'),i=>i.paid))}</b></div>
    <div class="kpi"><span>فلوس عند العملاء</span><b class="${debts>0?'neg':''}">${egp(debts)}</b></div>
    <div class="kpi"><span>قيمة المخزن (تكلفة)</span><b>${egp(sv)}</b></div>
    ${supTracked().length?`<div class="kpi" data-act="go:supply" style="cursor:pointer"><span>محتاجة للشراء (المتعاقد) ←</span><b class="${supTotals().need>0?'neg':'pos'}">${egp(supTotals().need)}</b></div>`:''}
    <div class="kpi pf"><span>مكسب متوقع من المخزن</span><b class="pos">${egp(ssv-sv)}</b></div>
  </div>
  </section>
  <section class="band" style="padding-top:0">
  <div class="card"><h2>الأكثر مبيعاً <span class="mut" style="font-size:13px;font-weight:600">${pl}</span></h2>
  ${top.length?`<div class="bars">${top.map(([n,v])=>`<div class="r"><span>${esc(n)}</span><div class="t"><i style="width:${Math.max(4,v.v/mx*100)}%"></i></div><b>${egp(v.v)}</b></div>`).join('')}</div>`:'<div class="empty">لا توجد مبيعات في هذه الفترة</div>'}</div>
  <div class="card"><h2>نواقص المخزن <span class="tag ${low.length?'bad':'ok'}">${low.length}</span></h2>
  ${low.length?`<div class="list">${low.slice(0,5).map(i=>`<div class="it" data-act="item:${esc(i.id)}"><div class="grow"><b>${esc(i.name)}</b><small>الحد الأدنى ${fmt(i.min)} ${esc(i.unit)}</small></div><div class="amt neg">${fmt(i.qty)} ${esc(i.unit)}</div></div>`).join('')}${low.length>5?`<button class="btn sm" style="width:100%;margin-top:6px" data-act="lowall">عرض كل النواقص (${low.length})</button>`:''}</div>`:'<div class="empty">كل الأصناف فوق الحد الأدنى</div>'}</div>
  <div class="card"><h2>آخر الفواتير<span class="sp"></span><button class="btn sm" data-act="go:invoices">الكل</button></h2>
  ${invs().slice(0,5).map(invItem).join('')||'<div class="empty">لا توجد فواتير بعد. اضغط زر «فاتورة» بالأسفل</div>'}</div>
  </section>`;
}
const invItem=i=>`<div class="list"><div class="it" data-act="invoice:${esc(i.id)}"><div class="grow"><b>#${esc(i.no)} — ${esc(i.custName)}</b><small>${esc(i.date)} · <span class="tag">${esc(i.pay||'نقدي')}</span> · ${(i.lines||[]).length} صنف ${due(i)>0?`· <span class="tag bad">باقي ${egp(due(i))}</span>`:''}</small></div><div class="amt">${egp(i.total)}<br><small class="pos pf">+${fmt(i.profit)}</small></div></div></div>`;

/* ---------- stock ---------- */
function vStock(){
  const its=items();
  return `<section class="band">
  <div class="sec">المخزن الرئيسي <span class="tag">${its.length} صنف</span><span class="sp"></span><button class="btn sm" data-act="go:supply">المتعاقد والموردين</button><button class="btn p sm" data-act="newitem">+ صنف جديد</button></div>
  <input class="search" id="sq" placeholder="ابحث باسم الصنف…" value="${esc(stockQ)}" type="search">
  <div class="chips">${[['all','الكل'],['low','النواقص'],['off','الخامل']].map(([k,l])=>`<button class="chip ${stockF===k?'on':''}" data-act="sf:${k}">${l}</button>`).join('')}</div>
  <div class="scroll"><table class="tbl"><thead><tr><th class="first">الصنف</th><th>الوحدة</th><th class="n">الكمية</th><th class="n">السعر الأساسي</th><th class="n">سعر الشركة</th><th class="n pf">المكسب</th><th>ملاحظات</th></tr></thead>
  <tbody id="stockBody">${stockRows()}</tbody>
  <tfoot><tr><td class="first">قيمة المخزن</td><td></td><td></td><td class="n">${egp(sum(its,i=>num(i.qty)*num(i.cost)))}</td><td class="n">${egp(sum(its,i=>num(i.qty)*num(i.sell)))}</td><td></td><td></td></tr></tfoot></table></div>
  <p class="mut" style="font-size:13px">اضغط على أي سطر لتعديل الاسم أو السعر أو الوحدة أو الكمية أو إضافة رصيد جديد.</p>
  </section>`;
}
function stockRows(){
  const q=stockQ.trim();
  const r=items().filter(i=>(!q||String(i.name).includes(q))&&(stockF==='all'||(stockF==='low'?i.active!==false&&num(i.qty)<=num(i.min):i.active===false)));
  if(!r.length)return `<tr><td colspan="7" class="empty">${list('items').length?'لا توجد نتائج':'المخزن فارغ — أضف أول صنف'}</td></tr>`;
  return r.map(i=>{const m=num(i.sell)-num(i.cost);return `<tr data-act="item:${esc(i.id)}" class="${i.active===false?'off':''} ${num(i.qty)<=num(i.min)?'low':''}"><td class="nm first">${esc(i.name)}${i.active===false?' <span class="tag">خامل</span>':''}</td><td>${esc(i.unit)}</td><td class="n q">${fmt(i.qty)}</td><td class="n">${fmt(i.cost)}</td><td class="n">${fmt(i.sell)}</td><td class="n pf ${m>=0?'pos':'neg'}">${fmt(m)}${num(i.cost)?` <small>(${Math.round(m/num(i.cost)*100)}%)</small>`:''}</td><td class="nt">${esc(i.notes)}</td></tr>`}).join('');
}
function itemModal(id,after){
  const o=id?S.items[id]:{name:'',unit:'عدد',qty:0,cost:'',sell:'',min:0,cat:'',notes:'',active:true};
  if(!o)return;
  const cats=[...new Set(list('items').map(i=>i.cat).filter(Boolean))];
  const draw=()=>openModal(`<h3>${id?'تعديل صنف':'صنف جديد'}</h3>
  <form id="itf">
  ${f('name','اسم الصنف',o.name,'text','required')}
  <div class="g2"><label class="fld"><span>الوحدة</span><input name="unit" list="ul" value="${esc(o.unit)}"></label>
  <label class="fld"><span>التصنيف</span><input name="cat" list="cl" value="${esc(o.cat)}"></label></div>
  <datalist id="ul">${UNITS.map(u=>`<option value="${u}">`).join('')}</datalist><datalist id="cl">${cats.map(u=>`<option value="${esc(u)}">`).join('')}</datalist>
  <div class="g2">${f('qty','الكمية الحالية',fmt(o.qty).replace(/,/g,''),'num')}${f('min','الحد الأدنى (تنبيه نواقص)',o.min,'num')}</div>
  <div class="g2">${f('cost','السعر الأساسي (تكلفة)',o.cost,'num')}${f('sell','سعر الشركة (البيع)',o.sell,'num')}</div>
  <div class="margin pf" id="mg"></div>
  <label class="fld"><span>المورد</span><select name="sup"><option value="">— من غير مورد —</option>${supL().map(x=>`<option value="${esc(x.id)}" ${x.id===(o.sup||'')?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <div class="g2">${f('contract','الكمية المتعاقد عليها مع الشركة',o.contract??'','num')}${f('req','المطلوب الشهر ده (فاضي = المتعاقد عليه)',o.req??'','num')}</div>
  <label class="fld"><span>ملاحظات</span><textarea name="notes">${esc(o.notes)}</textarea></label>
  <label class="chk"><input type="checkbox" name="active" ${o.active!==false?'checked':''}> الصنف نشط (يظهر في الفواتير)</label>
  <div class="acts"><button class="btn p grow" type="submit">حفظ</button>${id?'<button class="btn d" type="button" id="idel">حذف</button>':''}<button class="btn" type="button" data-act="close">إلغاء</button></div>
  </form>
  ${id?`<div class="box"><h4>إضافة رصيد (شراء بضاعة)</h4><div class="g2">${f('addq','الكمية المضافة','','num','id="addq"')}${f('addc','سعر الشراء للوحدة',o.cost,'num','id="addc"')}</div><button class="btn a" id="addb" type="button" style="width:100%">إضافة للمخزن</button><p class="mut" style="font-size:13px;margin:6px 0 0">لو سعر الشراء اختلف، يتم حساب متوسط التكلفة تلقائياً.</p></div>`:''}`,bind);
  const bind=s=>{
    rebind=bind;
    const fm=s.querySelector('#itf');
    const upd=()=>{const d=formData(fm),c=num(d.cost),p=num(d.sell);s.querySelector('#mg').innerHTML=`المكسب في ال${esc(d.unit||'وحدة')}: <span class="${p-c>=0?'pos':'neg'}">${egp(p-c)}</span>${c?` (${Math.round((p-c)/c*100)}%)`:''}`};
    fm.addEventListener('input',upd);upd();
    fm.onsubmit=async e=>{e.preventDefault();const d=formData(fm);if(!d.name.trim())return toast('اكتب اسم الصنف');
      const nid=id||uid(),nq=r2(d.qty);
      const n={...(id?S.items[id]:{order:list('items').length+1,created:Date.now()}),name:d.name.trim(),unit:d.unit.trim()||'عدد',cat:d.cat.trim(),qty:nq,min:r2(d.min),cost:r2(d.cost),sell:r2(d.sell),notes:d.notes.trim(),active:!!d.active,sup:d.sup||'',contract:optNum(d.contract),req:optNum(d.req),updated:Date.now()};
      closeModal();
      await put('items',nid,n);
      const oq=id?num(o.qty):0;
      if(nq!==oq)await put('moves',uid(),{date:today(),ts:Date.now(),itemId:nid,name:n.name,unit:n.unit,qty:r2(nq-oq),type:id?'تعديل جرد':'رصيد افتتاحي',ref:''});
      toast('تم الحفظ');after?after(nid):render()};
    const db_=s.querySelector('#idel');if(db_)db_.onclick=async()=>{const used=list('invoices').some(i=>(i.lines||[]).some(l=>l.itemId===id));
      if(await ask(used?`«${o.name}» مستخدم في فواتير سابقة. الأفضل تخليه خامل بدل الحذف. تحذف برضه؟`:`حذف «${o.name}» نهائياً؟`,'حذف')){await del('items',id);toast('تم الحذف');render()}};
    const ab=s.querySelector('#addb');if(ab)ab.onclick=async()=>{const q=num(s.querySelector('#addq').value),c=num(s.querySelector('#addc').value)||num(o.cost);if(q<=0)return toast('اكتب الكمية المضافة');
      const cur=S.items[id],oq=num(cur.qty),oc=num(cur.cost);const nc=oq>0?r2((oq*oc+q*c)/(oq+q)):c;
      closeModal();await put('items',id,{...cur,qty:r2(oq+q),cost:nc,updated:Date.now()});
      await put('moves',uid(),{date:today(),ts:Date.now(),itemId:id,name:cur.name,unit:cur.unit,qty:q,cost:c,type:'شراء',ref:cur.sup&&S.suppliers[cur.sup]?'من '+S.suppliers[cur.sup].name:'',sup:cur.sup||''});
      toast(`تمت إضافة ${fmt(q)} ${cur.unit}`);render()};
  };
  draw();
}

  return `<section class="band"><div class="sec"><button class="btn sm" data-act="go:more">→</button> العملاء <span class="tag">${list('customers').length}</span><span class="sp"></span><button class="btn p sm" data-act="newcust">+ عميل</button></div>

function custStats(id){const iv=list('invoices').filter(i=>i.cust===id);return{n:iv.length,total:sum(iv,i=>i.total),due:sum(iv,due),profit:sum(iv,i=>i.profit),last:iv.map(i=>i.date).sort().pop()}}

  const q=custQ.trim();const r=custs().filter(c=>!q||String(c.name).includes(q)||String(c.phone).includes(q));
  if(!r.length)return `<div class="empty">${list('customers').length?'لا توجد نتائج':'لا يوجد عملاء بعد'}</div>`;

function custModal(id,after){

/* ---------- invoice editor: every item in one table, type the quantity only ---------- */
const nextNo=()=>Math.max(0,...list('invoices').map(i=>num(i.no)))+1;
let invSel='all',invItemQ='';
function newDraft(cust){return{id:null,no:nextNo(),date:today(),cust:cust||'',q:{},p:{},meta:{},hid:[...(st().invHidden||[])],discount:'',paid:'',coll:'no',notes:'',pay:'نقدي'}}
const dPrice=id=>{const d=draft;if(d.p[id]!==undefined&&d.p[id]!=='')return num(d.p[id]);const it=S.items[id];return it?num(it.sell):num((d.meta[id]||{}).price)};
const dCost=id=>{const m=draft.meta[id];if(m&&m.cost!==undefined)return num(m.cost);const it=S.items[id];return it?num(it.cost):0};
const chosen=()=>Object.keys(draft.q).filter(id=>num(draft.q[id])>0&&(S.items[id]||draft.meta[id]));
function invRowsHtml(){
  const d=draft,q=invItemQ.trim(),ids=new Set(chosen());
  let r=items().filter(i=>i.active!==false||ids.has(i.id));
  Object.keys(d.meta).forEach(id=>{if(!S.items[id]&&ids.has(id))r.push({id,name:d.meta[id].name,unit:d.meta[id].unit,qty:0,gone:true})});
  const hid=new Set(d.hid||[]);
  if(invSel==='sel')r=r.filter(i=>ids.has(i.id));else if(invSel==='hid')r=r.filter(i=>hid.has(i.id)&&!ids.has(i.id));else r=r.filter(i=>!hid.has(i.id)||ids.has(i.id));
  if(q)r=r.filter(i=>String(i.name).includes(q));
  if(!r.length)return `<tr><td colspan="4" class="empty">${invSel==='sel'?'لسه ما اخترتش أصناف — اكتب الكمية قدام الصنف':invSel==='hid'?'مفيش أصناف مشالة':list('items').length?'لا توجد نتائج':'مفيش أصناف لسه — دوس «+ صنف جديد»'}</td></tr>`;
  return r.map(i=>{const qq=d.q[i.id]??'';return `<tr data-id="${esc(i.id)}" class="${num(qq)>0?'sel':''}">
  <td class="nm"><b ${i.gone?'':`data-act="item:${esc(i.id)}"`}>${esc(i.name)}</b><small>${esc(i.unit)} · متاح ${fmt(i.qty)}</small><div class="lwarn"></div></td>
  <td class="n"><input class="iqt" inputmode="decimal" placeholder="0" value="${esc(qq)}" aria-label="كمية ${esc(i.name)}"></td>
  <td class="n"><input class="ip" inputmode="decimal" value="${fmt(dPrice(i.id)).replace(/,/g,'')}" aria-label="سعر ${esc(i.name)}"></td>
  <td class="n"><span class="itot">${num(qq)>0?fmt(num(qq)*dPrice(i.id)):'—'}</span>${invSel==='hid'?`<button class="irm add" data-act="unhide:${esc(i.id)}" aria-label="رجّع ${esc(i.name)}">+</button>`:`<button class="irm" data-act="hide:${esc(i.id)}" aria-label="شيل ${esc(i.name)} من القايمة">×</button>`}</td></tr>`}).join('');
}

  const disc=num(d.discount),tot=Math.max(0,sub-disc);if(!d.coll)d.coll=dColl(d,tot);const paid=dPaid(d,tot);
  $$('.cpart').forEach(e=>e.style.display=d.coll==='part'?'':'none');$$('#icoll button').forEach(b=>b.classList.toggle('on',b.dataset.act==='coll:'+d.coll));

function refreshLineHints(){

async function saveInv(btn){

  const old=d.id?S.invoices[d.id]:null,id=d.id||uid();

  for(const [iid,dq] of Object.entries(delta)){if(!r2(dq))continue;const it=S.items[iid];if(!it)continue;

  draft=null;saveDraft();invSel='all';invItemQ='';go('invoices',true);toast(old?'تم تعديل الفاتورة':'تم حفظ الفاتورة');invModal(id);
}

/* before html2pdf: (1) wrap each word in its own span, because html2canvas glues Arabic words together;
   (2) split the items table at each A4 page edge and repeat the header row on every page. */
function pdfPrep(paper){
  const tw=document.createTreeWalker(paper,NodeFilter.SHOW_TEXT),ns=[];while(tw.nextNode())ns.push(tw.currentNode);
  ns.forEach(n=>{const v=n.nodeValue;if(!/\S\s+\S/.test(v)&&!/[\u0600-\u06FF][^\u0600-\u06FF\w\s]|[^\u0600-\u06FF\w\s][\u0600-\u06FF]/.test(v))return;const fr=document.createDocumentFragment();
    v.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p))return fr.appendChild(document.createTextNode(' '));(/[\u0600-\u06FF]/.test(p)?p.split(/([^\u0600-\u06FF\w]+)/):[p]).forEach(q=>{if(!q)return;const sp=document.createElement('span');sp.textContent=q;fr.appendChild(sp)})});n.replaceWith(fr)});
  const W=paper.offsetWidth,H=Math.floor(W*285/198)-8,top=()=>paper.getBoundingClientRect().top;
  let cur=paper.querySelector('table'),start=0;if(!cur||!cur.tHead)return;
  for(let g=0;g<50;g++){const rows=[...cur.tBodies[0].rows],t0=top(),k=rows.findIndex(r=>r.getBoundingClientRect().bottom-t0-start>H);if(k<=0)break;
    const br=document.createElement('div');br.className='html2pdf__page-break';
    const nt=cur.cloneNode(false),nb=document.createElement('tbody');nt.appendChild(cur.tHead.cloneNode(true));nt.appendChild(nb);rows.slice(k).forEach(r=>nb.appendChild(r));
    cur.after(br);br.after(nt);start=nt.getBoundingClientRect().top-top();cur=nt}
}

/* ---------- contracted quantities + suppliers (v21) ----------
   item.contract = quantity agreed with the company each month (fixed); item.req = what the company asked for this month ('' = same as contract);
   item.sup = supplier id. «الموجود» is item.qty, the price paid to the supplier is item.cost.
   suppliers/{id} = {name, phone, notes, open (old balance owed to them)}; spay/{id} = {sup, date, amount, when, notes} money paid to a supplier.
   A supplier's account = open + purchases recorded with that supplier (moves type 'شراء' carrying sup) − payments. */
const optNum=v=>String(v??'').trim()===''?'':r2(v);
const supL=()=>list('suppliers').sort((a,b)=>String(a.name).localeCompare(b.name,'ar'));
const supName=id=>(S.suppliers[id]||{}).name||'';
const reqOf=i=>String(i.req??'').trim()===''?num(i.contract):num(i.req);
const leftOf=i=>Math.max(0,r2(reqOf(i)-num(i.qty)));
const supTracked=()=>items().filter(i=>i.active!==false&&(num(i.contract)>0||num(i.req)>0));
const WHEN=['قبل التوريد (مقدم)','بعد التوريد'];
function supAcc(id){const s=S.suppliers[id]||{};
  const bought=sum(list('moves').filter(m=>m.sup===id&&m.type==='شراء'),m=>num(m.qty)*num(m.cost));
  const pays=list('spay').filter(p=>p.sup===id).sort((a,b)=>String(b.date).localeCompare(a.date)||num(b.ts)-num(a.ts));
  const paid=sum(pays,p=>p.amount),bal=r2(num(s.open)+bought-paid);
  const its=supTracked().filter(i=>(i.sup||'')===id),short=its.filter(i=>leftOf(i)>0);
  const left=r2(sum(its,i=>leftOf(i)*num(i.cost)));
  /* money still needed for this supplier: what the rest costs, less any advance they already hold */
  return{bought,paid,bal,pays,its,short,left,need:Math.max(0,r2(left+Math.min(0,bal)))}}
function supTotals(){const tr=supTracked();
  const reqC=sum(tr,i=>reqOf(i)*num(i.cost)),have=sum(tr,i=>Math.min(num(i.qty),reqOf(i))*num(i.cost)),left=sum(tr,i=>leftOf(i)*num(i.cost)),sales=sum(tr,i=>reqOf(i)*num(i.sell));
  let need=sum(tr.filter(i=>!S.suppliers[i.sup]),i=>leftOf(i)*num(i.cost)),owed=0;
  supL().forEach(s=>{const a=supAcc(s.id);need+=a.need;if(a.bal>0)owed+=a.bal});
  return{tr,reqC,have,left,need:r2(need),owed,sales,short:tr.filter(i=>leftOf(i)>0).length,noCost:tr.filter(i=>leftOf(i)>0&&!num(i.cost)).length}}
const balTxt=b=>b>0?`<span class="neg">ليه عندك ${egp(b)}</span>`:b<0?`<span class="pos">ليكي عنده ${egp(-b)} (مقدم)</span>`:'<span class="mut">خالص</span>';

  return `<section class="band"><div class="sec"><button class="btn sm" data-act="go:more">→</button> المتعاقد والموردين<span class="sp"></span><button class="btn p sm" data-act="newsup">+ مورد</button></div>
  ${T.tr.length?`<div class="kpis" style="margin-bottom:10px">
    ${kp('المطلوب من الشركة الشهر ده (بسعر الشراء)',egp(T.reqC))}
    ${kp('قيمة الموجود منه في المخزن',egp(T.have))}

/* the contracted quantities and prices on the Super Clean invoice to the company (no. 1, 19/11/2026), in SEED order; null = not on the invoice */
const CONTRACT_INV=[[1200,13],[500,18],[250,27.5],[29,150],[40,45],[6,62],[24,71],[5,28],[30,45],[30,30],[3,130],[6,130],[10,45],[18,110],null,[60,40],[8,120],[8,65],[24,25],[3,70],[18,70],[20,97],null,[2,40],[24,20],[12,15]];
async function fillContract(){const plan=[];
  list('items').forEach(i=>{let k=-1;const m=/^fm(\d\d)$/.exec(i.id);if(m)k=num(m[1])-1;else k=SEED.findIndex(s=>s[0].trim()===String(i.name).trim());
    const c=CONTRACT_INV[k];if(!c)return;let [q,p]=c;if(k===16&&/ربع/.test(i.unit||'')){q*=2;p/=2}/* tea: 500 g packs on the invoice, quarters in the shop */
    const o={};if(String(i.contract??'')==='')o.contract=q;if(!num(i.sell))o.sell=p;if(Object.keys(o).length)plan.push([i,o])});
  if(!plan.length)return toast('مفيش أصناف فاضية تتملي من الفاتورة');
  if(!(await ask(`هيتكتب المتعاقد عليه (وسعر الشركة لو فاضي) من الفاتورة في ${plan.length} صنف. الأرقام اللي انتي كاتباها مش هتتغير.`,'املا',false)))return;
  for(const [i,o] of plan)await put('items',i.id,{...S.items[i.id],...o,updated:Date.now()});toast(`اتملى ${plan.length} صنف، راجعيهم في الجدول`);render()}

  <button class="btn p" style="width:100%" data-act="mailbk">إرسال نسخة على الإيميل</button>
  <div class="acts" style="margin-top:8px">${user?'<button class="btn grow" data-act="cloudbk">النسخ التلقائية</button>':''}<button class="btn grow" data-act="export">تنزيل ملف</button><button class="btn grow" data-act="import">استرجاع من ملف</button></div></div>
  ${user?`<form class="card" id="bkf"><h2>إرسال تلقائي على الإيميل كل يوم</h2>
  <p class="mut" style="margin-top:0">${s.bkUrl?`شغال ✓ ${s.bkMail?`— آخر إرسال: <b>${esc(s.bkMail)}</b>`:''}`:'مش متفعّل لسه. بيتعمل مرة واحدة بس من الكمبيوتر (حوالي 5 دقايق).'}</p>
  ${f('bkTo','الإيميلات اللي تستلم النسخة (افصل بينهم بمسافة)',s.bkTo,'text','dir="ltr" placeholder="her@gmail.com him@gmail.com"')}
  ${f('bkUrl','رابط الإرسال (Web app URL)',s.bkUrl,'url','dir="ltr" placeholder="https://script.google.com/macros/s/…/exec"')}
  <div class="acts"><button class="btn p grow" type="submit">حفظ</button><button class="btn grow" type="button" data-act="copyscript">نسخ كود الإرسال</button></div></form>`:''}
  <div class="card"><h2>التحديث</h2><p class="mut" style="margin-top:0">إنت على إصدار ${APP_V}. لو اتعمل تعديل جديد ومش ظاهر، اضغط هنا. البيانات مش هتتمسح.</p><div class="acts"><button class="btn p grow" data-act="forceupdate">تحديث لآخر نسخة</button><button class="btn grow" data-act="whatsnew">إيه الجديد؟</button></div></div>
  <div class="card"><h2>تثبيت التطبيق على الموبايل <span class="tag">إصدار ${APP_V}</span></h2><p style="margin:0" class="mut">افتح <b dir="ltr">ahmed-elbaz84.github.io/superclean</b> في المتصفح ثم: <b>أندرويد</b>: القائمة ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». <b>آيفون (سفاري)</b>: زر المشاركة ← «إضافة إلى الشاشة الرئيسية». أي تحديث جديد بيوصل لوحده لما تفتح التطبيق والنت شغال.</p>${standalone()?'':`<button class="btn p" style="width:100%;margin-top:10px" data-act="install" data-inst ${bip?'':'hidden'}>تثبيت التطبيق</button>`}<button class="btn" style="width:100%;margin-top:8px" data-act="shareapp">شارك التطبيق مع حد تاني (QR)</button></div></section>`}
async function exportData(){const data=JSON.stringify({app:'superclean',at:new Date().toISOString(),data:Object.fromEntries(COLS.map(c=>[c,S[c]]))});
  saveBlob(new Blob([data],{type:'application/json'}),`superclean-backup-${today()}.json`);toast('تم تنزيل النسخة الاحتياطية')}
async function restoreObj(d){toast('جاري الاسترجاع…');let n=0;for(const c of COLS)for(const [id,o] of Object.entries((d&&d[c])||{})){if(!/^[\w-]{1,60}$/.test(id)||!o||typeof o!=='object'||Array.isArray(o))continue;await put(c,id,o);n++}
  if(!n)return toast('الملف مفيهوش بيانات من Super Clean');toast('تم الاسترجاع');render()}
async function importData(file){try{const j=JSON.parse(await file.text()),d=j.data||j;if(!(await ask('استرجاع البيانات من الملف؟ السجلات الموجودة بنفس الرقم ستُستبدل.','استرجاع',false)))return;
  await restoreObj(d)}catch(e){toast('الملف غير صالح')}}

/* ---------- backups: a daily copy inside the account (last 7 days), a daily e-mail (via the owner's Google Apps Script), and a share-to-e-mail button ---------- */
const bkJSON=()=>JSON.stringify({app:'superclean',at:new Date().toISOString(),data:Object.fromEntries(COLS.map(c=>[c,S[c]]))});
const bkSummary=()=>`${list('items').length} صنف · ${list('customers').length} عميل · ${list('invoices').length} فاتورة · ${list('expenses').length} مصروف`;
const BKN='superclean-backup-';
function b64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)}
async function gz(str){if(!window.CompressionStream)return{z:0,s:str};return{z:1,s:b64(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())}}
async function ungz(z,s){if(!z)return s;const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
const bkCol=c=>fs.collection('users').doc(user.uid).collection(c);
const setMain=o=>put('settings','main',{...(S.settings.main||{id:'main'}),...o});
let bkBusy=false;
async function autoBackup(){
  if(!user||!synced||bkBusy||!navigator.onLine)return;const d=today(),m=S.settings.main||{};
  if(m.bkCloud===d&&(!m.bkUrl||m.bkMail===d))return;
  if(!list('items').length)return;bkBusy=true;
  try{const raw=bkJSON();
    if(m.bkCloud!==d){const {z,s:str}=await gz(raw),P=700000,n=Math.ceil(str.length/P)||1;
      for(let k=0;k<n;k++)await bkCol('sc_bkparts').doc(d+'_'+k).set({s:str.slice(k*P,(k+1)*P)});
      await bkCol('sc_backups').doc(d).set({id:d,at:Date.now(),z,parts:n,sum:bkSummary()});
      const old=(await bkCol('sc_backups').get()).docs.map(x=>x.data()).sort((a,b)=>String(b.id).localeCompare(a.id)).slice(7);
      for(const o of old){for(let k=0;k<num(o.parts);k++)await bkCol('sc_bkparts').doc(o.id+'_'+k).delete();await bkCol('sc_backups').doc(o.id).delete()}
      await setMain({bkCloud:d})}
    if(m.bkUrl&&m.bkMail!==d){await fetch(m.bkUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({date:d,summary:bkSummary(),name:BKN+d+'.json',file:raw})});await setMain({bkMail:d})}
  }catch(e){}finally{bkBusy=false}}
async function cloudList(){
  if(!user||!fs)return toast('لازم تكون داخل بحساب والنت شغال');
  openModal('<h3>النسخ التلقائية على الحساب</h3><p class="mut">جاري التحميل…</p>');
  try{const l=(await bkCol('sc_backups').get({source:'server'})).docs.map(x=>x.data()).sort((a,b)=>String(b.id).localeCompare(a.id));
    openModal(`<h3>النسخ التلقائية على الحساب</h3><p class="mut" style="margin-top:0">نسخة كل يوم بتتحفظ لوحدها، وبنحتفظ بآخر 7 أيام. استرجاع نسخة بيرجّع الأصناف والفواتير زي ما كانت يومها (السجلات الجديدة بعدها بتفضل موجودة).</p>
    ${l.length?l.map(o=>`<div class="box" style="display:flex;gap:8px;align-items:center"><div style="flex:1"><b>${esc(o.id)}</b><br><small class="mut">${esc(o.sum||'')}</small></div><button class="btn sm" data-bk="${esc(o.id)}">استرجاع</button></div>`).join(''):'<p class="empty">لسه مفيش نسخ. أول نسخة بتتعمل لوحدها النهارده.</p>'}
    <div class="acts"><button class="btn" data-act="close">قفل</button></div>`,sh=>sh.querySelectorAll('[data-bk]').forEach(b=>b.onclick=async()=>{const o=l.find(x=>x.id===b.dataset.bk);
      if(!(await ask(`استرجاع نسخة يوم ${o.id}؟`,'استرجاع',false)))return;
      try{let str='';for(let k=0;k<num(o.parts);k++)str+=(await bkCol('sc_bkparts').doc(o.id+'_'+k).get()).data().s;closeModal();await restoreObj(JSON.parse(await ungz(o.z,str)).data)}catch(e){toast('مش قادر أجيب النسخة، اتأكد من النت')}}))
  }catch(e){openModal('<h3>النسخ التلقائية</h3><p>مش قادر أوصل للحساب دلوقتي، اتأكد من النت وجرب تاني.</p><div class="acts"><button class="btn" data-act="close">قفل</button></div>')}}
async function mailBackup(){const name=BKN+today()+'.json',file=new File([bkJSON()],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Super Clean — نسخة احتياطية '+today(),text:'نسخة احتياطية من Super Clean ('+bkSummary()+')'});if(user)setMain({bkShared:today()});return}}catch(e){if(e&&e.name==='AbortError')return}
  saveBlob(file,name);toast('الموبايل ده مش بيدعم المشاركة، الملف اتنزّل — ابعته على الإيميل من التنزيلات')}
function mailScript(){const to=(st().bkTo||'').split(/[\s,;]+/).filter(Boolean).join(',')||'EMAIL1@gmail.com,EMAIL2@gmail.com';
  return `// Super Clean — إرسال نسخة احتياطية يومية على الإيميل\nconst TO='${to.replace(/[^\w.@+,-]/g,'')}';\nfunction doPost(e){\n  const j=JSON.parse(e.postData.contents);\n  const blob=Utilities.newBlob(j.file,'application/json',j.name);\n  MailApp.sendEmail({to:TO,subject:'Super Clean — نسخة احتياطية '+j.date,\n    body:'نسخة احتياطية تلقائية من تطبيق Super Clean ('+j.summary+').\\nلو احتجتها: افتح التطبيق ← المزيد ← الإعدادات ← استرجاع من ملف، واختار الملف ده.',\n    attachments:[blob]});\n  return ContentService.createTextOutput('ok');\n}\n`}

/* ---------- events ---------- */
const A={
  go:v=>go(v),close:()=>{if(!$('#modal').hidden)closeModal()},
  hp:()=>{document.body.classList.toggle('hp');try{localStorage.setItem('sc-hp',document.body.classList.contains('hp')?'1':'0')}catch(e){}hpIcon()},
  period:p=>{period=p;render()},pay:p=>{draft.pay=p;saveDraft();render()},collfull:async id=>{const i=S.invoices[id];await put('invoices',id,{...i,paid:num(i.total),updated:Date.now()});toast('تم التحصيل');render();invModal(id)},
  collnone:async id=>{const i=S.invoices[id];if(!(await ask('إلغاء التحصيل؟ المدفوع هيتمسح والفاتورة هترجع «لسه ما اتحصّلتش».','إلغاء التحصيل')))return invModal(id);await put('invoices',id,{...S.invoices[id],paid:0,updated:Date.now()});toast('اتلغى التحصيل');render();invModal(id)},
  coll:v=>{draft.coll=v;if(v==='part'){const x=$('#ipaid');setTimeout(()=>x&&x.focus(),50)}recalc()},hide:id=>{const d=draft;delete d.q[id];delete d.p[id];d.hid=[...new Set([...(d.hid||[]),id])];invHidSave(d.hid);$('#ibody').innerHTML=invRowsHtml();recalc()},
  unhide:id=>{const d=draft;d.hid=(d.hid||[]).filter(x=>x!==id);invHidSave(d.hid);$('#ibody').innerHTML=invRowsHtml();recalc();toast('رجع لقايمة الفاتورة')},lowall:()=>{stockF='low';go('stock')},sf:k=>{stockF=k;render()},if:k=>{invF=k;render()},
  item:id=>itemModal(id),newitem:()=>itemModal(null),
  cust:id=>custModal(id),newcust:()=>custModal(null),
  custinv:id=>{closeModal();draft=newDraft(id);go('inv')},
  quickcust:()=>custModal(null,nid=>{draft.cust=nid;render()}),
  quickitem:()=>itemModal(null,nid=>{invSel='all';invItemQ='';const h=new Set(draft.hid||[]);h.delete(nid);draft.hid=[...h];saveDraft();render();setTimeout(()=>{const r=document.querySelector(`#ibody tr[data-id="${nid}"]`);if(r){r.scrollIntoView({block:'center'});const q=r.querySelector('.iqt');q&&q.focus()}},60)}),
  isel:k=>{invSel=k;$('#ibody').innerHTML=invRowsHtml();$$('[data-act^="isel:"]').forEach(b=>b.classList.toggle('on',b.dataset.act==='isel:'+k));recalc()},
  invoice:id=>invModal(id),
  clearinv:async()=>{if(chosen().length&&!(await ask('تفريغ الفاتورة الحالية؟','تفريغ')))return;draft=null;saveDraft();show('inv')},
  saveinv:(a,b)=>saveInv(b),
  pdf:(id,b)=>makePdf(id,b),sharepdf:(id,b)=>makePdf(id,b,true),
  signup:()=>auth('up'),forgot:()=>auth('forgot'),signout:async()=>{if(await ask('خروج من الحساب على الموبايل ده؟','خروج')){await fb.auth().signOut();toast('خرجت من الحساب')}},
  copyinv:async id=>{try{await navigator.clipboard.writeText(waText(S.invoices[id]));toast('تم النسخ')}catch(e){toast('تعذر النسخ')}},
  editinv:id=>{const i=S.invoices[id];closeModal();const q={},p={},meta={};(i.lines||[]).forEach(l=>{q[l.itemId]=String(r2(num(q[l.itemId])+num(l.qty)));const it=S.items[l.itemId];if(!it||num(it.sell)!==num(l.price))p[l.itemId]=String(l.price);meta[l.itemId]={name:l.name,unit:l.unit,cost:l.cost,price:l.price}});
    invSel='sel';invItemQ='';draft={id,no:i.no,date:i.date,cust:i.cust,q,p,meta,discount:num(i.discount)?String(i.discount):'',paid:String(i.paid),coll:num(i.paid)>=num(i.total)?'full':num(i.paid)>0?'part':'no',notes:i.notes||'',pay:i.pay||'نقدي'};saveDraft();go('inv')},
  delinv:async id=>{const i=S.invoices[id];if(!(await ask(`حذف فاتورة #${i.no}؟ سيتم إرجاع الكميات للمخزن.`,'حذف')))return;
    for(const l of i.lines||[]){const it=S.items[l.itemId];if(!it)continue;await put('items',it.id,{...S.items[it.id],qty:r2(num(S.items[it.id].qty)+num(l.qty))});await put('moves',uid(),{date:today(),ts:Date.now(),itemId:it.id,name:it.name,unit:it.unit,qty:r2(l.qty),type:'إلغاء فاتورة',ref:`فاتورة #${i.no}`})}
    await del('invoices',id);toast('تم حذف الفاتورة وإرجاع الكميات');render()},
  exp:id=>expModal(id||null),
  sup:id=>supModal(id),newsup:()=>supModal(null),spay:a=>{const [s_,p_]=a.split('/');payModal(s_,p_||null)},supf:k=>{supF=k;render()},
  reqreset:()=>reqReset(),fillcontract:()=>fillContract(),

  forceupdate:()=>forceUpdate(),whatsnew:()=>whatsNew(true),shareapp:()=>shareModal(),sharelink:()=>shareLink(),
  install:async()=>{if(!bip)return;const e=bip;bip=null;e.prompt();const r=await e.userChoice.catch(()=>null);if(r&&r.outcome==='accepted')closeModal()},
  wlogin:()=>{onClose=null;closeModal();go('settings');setTimeout(()=>{const x=document.querySelector('#authf input');x&&x.focus()},100)},
  export:()=>exportData(),import:()=>$('#impfile').click(),mailbk:()=>mailBackup(),cloudbk:()=>cloudList(),
  copyscript:async()=>{try{await navigator.clipboard.writeText(mailScript());toast('اتنسخ الكود')}catch(e){openModal(`<h3>كود الإرسال</h3><textarea class="in" style="height:260px;direction:ltr" readonly>${esc(mailScript())}</textarea><div class="acts"><button class="btn" data-act="close">قفل</button></div>`)}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const s=b.dataset.act,k=s.indexOf(':'),a=k<0?s:s.slice(0,k),arg=k<0?'':s.slice(k+1);if(A[a]){if(b.tagName!=='A')e.preventDefault();A[a](arg,b,e)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#impfile').addEventListener('change',e=>{const fl=e.target.files[0];e.target.value='';if(fl)importData(fl)});
$('#view').addEventListener('input',e=>{const t=e.target;
  if(t.id==='sq'){stockQ=t.value;$('#stockBody').innerHTML=stockRows();return}
  if(t.id==='iq'){invQ=t.value;$('#invBody').innerHTML=invRows();return}
  if(t.id==='cq'){custQ=t.value;$('#custBody').innerHTML=custRows();return}
  if(!draft)return;
  if(t.id==='isq'){invItemQ=t.value;$('#ibody').innerHTML=invRowsHtml();recalc();return}
  const tr=t.closest('#ibody tr[data-id]');
  if(tr){const id=tr.dataset.id;if(t.classList.contains('iqt'))draft.q[id]=t.value;if(t.classList.contains('ip'))draft.p[id]=t.value;recalc();return}
  if(t.id==='idisc'){draft.discount=t.value;recalc()}
  if(t.id==='ipaid'){draft.paid=t.value;recalc()}
  if(t.id==='inotes')draft.notes=t.value;
});
$('#view').addEventListener('change',e=>{const t=e.target;
  if(t.matches('#supBody input,#supBody select')){supEdit(t);return}
  if(t.id==='mf'){moveF=t.value;render();return}
  if(!draft)return;
  if(t.id==='icust'){draft.cust=t.value;saveDraft();return}
  if(t.id==='idate')draft.date=t.value;
});
$('#view').addEventListener('submit',async e=>{if(e.target.id==='authf'){e.preventDefault();auth('in');return}if(e.target.id==='bkf'){e.preventDefault();const d=formData(e.target),u=String(d.bkUrl||'').trim();if(u&&!/^https:\/\/script\.google\.com\//.test(u))return toast('الرابط لازم يبدأ بـ https://script.google.com/');await setMain({bkTo:String(d.bkTo||'').trim(),bkUrl:u,bkMail:''});toast('تم الحفظ');render();autoBackup();return}
  if(e.target.id!=='sf')return;e.preventDefault();const d=formData(e.target);await put('settings','main',{...st(),...Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v.trim()]))});toast('تم حفظ الإعدادات')});

/* keyboard: hide the tab bar while an input is focused, keep the field in view */
const isField=t=>t&&t.matches&&t.matches('input:not([type=checkbox]):not([type=file]),textarea,select');
document.addEventListener('focusin',e=>{if(!isField(e.target))return;document.body.classList.add('kb');const t=e.target;setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},300)});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!isField(document.activeElement))document.body.classList.remove('kb')},120));
boot();
}
</script>
