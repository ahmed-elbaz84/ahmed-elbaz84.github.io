<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Marcellus&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f1ea;font-family:"IBM Plex Sans Arabic";color:#17232a;padding:28px}
h1{font-family:"Reem Kufi";font-size:30px;margin:0 0 4px}p.s{margin:0 0 22px;color:#6b7479}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.c{background:#fff;border-radius:22px;padding:18px;box-shadow:0 14px 30px -22px rgba(0,0,0,.35);text-align:center}
.c .big{width:190px;height:190px;margin:4px auto 10px;display:block}
.n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#0b2a33;color:#e4c98f;font-weight:700;margin-bottom:6px}
.c b{display:block;font-family:"Reem Kufi";font-size:20px}
.c small{display:block;color:#6b7479;font-size:13px;line-height:1.5;min-height:40px}
.row{display:flex;justify-content:center;gap:10px;margin-top:10px;align-items:center}
.ic{width:54px;height:54px;border-radius:14px;overflow:hidden;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.ic svg{width:100%;height:100%}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid #0002}
</style></head><body>
<h1>أفكار شعار Super Clean</h1><p class="s">كل شعار معروض كبير، وجنبه شكله كأيقونة على الموبايل، والألوان اللي هيتبني عليها التطبيق.</p>
<div class="g" id="g"></div>
<script>
const SP=(x,y,r,c)=>`<path d="M${x} ${y-r}C${x+r*.18} ${y-r*.18} ${x+r*.18} ${y-r*.18} ${x+r} ${y}C${x+r*.18} ${y+r*.18} ${x+r*.18} ${y+r*.18} ${x} ${y+r}C${x-r*.18} ${y+r*.18} ${x-r*.18} ${y+r*.18} ${x-r} ${y}C${x-r*.18} ${y-r*.18} ${x-r*.18} ${y-r*.18} ${x} ${y-r}z" fill="${c}"/>`;
const L=[
{n:'قطرة دهبي',d:'قطرة مية دهبي ولمعة على كحلي بترولي. فخم وبسيط، قريب من روح أتيليه لوجي.',c:['#0b2a33','#15596a','#c6a15b'],s:`<defs><linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15596a"/><stop offset="1" stop-color="#0b2a33"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dca8"/><stop offset="1" stop-color="#b8904a"/></linearGradient></defs><circle cx="100" cy="100" r="100" fill="url(#a1)"/><circle cx="100" cy="100" r="88" fill="none" stroke="#c6a15b" stroke-width="2" opacity=".7"/><path d="M100 42C100 42 64 88 64 116a36 36 0 0 0 72 0C136 88 100 42 100 42z" fill="url(#g1)"/><path d="M80 118a20 20 0 0 0 18 20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".85"/>${SP(140,62,14,'#f0dca8')}${SP(58,72,7,'#f0dca8')}`},
{n:'حرفين SC',d:'حرف S وC متداخلين بخط كلاسيك ولمعة. شكل ماركة عالمية.',c:['#f7f3ea','#0b2a33','#c6a15b'],s:`<circle cx="100" cy="100" r="100" fill="#f7f3ea"/><circle cx="100" cy="100" r="90" fill="none" stroke="#0b2a33" stroke-width="3"/><circle cx="100" cy="100" r="83" fill="none" stroke="#c6a15b" stroke-width="1.5"/><text x="100" y="128" text-anchor="middle" font-family="Marcellus" font-size="86" fill="#0b2a33" letter-spacing="-6">SC</text>${SP(146,58,12,'#c6a15b')}<text x="100" y="160" text-anchor="middle" font-family="Marcellus" font-size="12" fill="#0b2a33" letter-spacing="4">SUPER CLEAN</text>`},
{n:'فقاعات صابون',d:'فقاعات شفافة بلون سماوي. مبهج ونضيف، ويناسب محل منظفات.',c:['#e3f4f8','#0a7d99','#7fd3e6'],s:`<defs><radialGradient id="b3" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#bfe9f3"/><stop offset="1" stop-color="#5cc3dc"/></radialGradient></defs><circle cx="100" cy="100" r="100" fill="#0a7d99"/><circle cx="88" cy="112" r="44" fill="url(#b3)" stroke="#fff" stroke-width="3"/><circle cx="138" cy="72" r="26" fill="url(#b3)" stroke="#fff" stroke-width="3"/><circle cx="62" cy="58" r="15" fill="url(#b3)" stroke="#fff" stroke-width="3"/><path d="M66 98a26 26 0 0 1 18-18" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M128 64a12 12 0 0 1 8-8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>${SP(150,132,10,'#ffd56a')}`},
{n:'بخاخة منظف',d:'زجاجة بخاخ ورذاذ دهبي. بيوضح الشغلانة من أول نظرة.',c:['#0d7a5c','#08503d','#e9c46a'],s:`<circle cx="100" cy="100" r="100" fill="#0d7a5c"/><circle cx="100" cy="100" r="88" fill="none" stroke="#e9c46a" stroke-width="2" opacity=".6"/><path d="M84 60h30l14 10v8h-18l-4 8H90z" fill="#fff"/><path d="M86 86h28v10c10 6 16 16 16 30v28a8 8 0 0 1-8 8H78a8 8 0 0 1-8-8v-28c0-14 6-24 16-30z" fill="#fff"/><rect x="80" y="118" width="40" height="22" rx="5" fill="#0d7a5c" opacity=".9"/><path d="M90 129h20" stroke="#e9c46a" stroke-width="4" stroke-linecap="round"/><circle cx="142" cy="66" r="4" fill="#e9c46a"/><circle cx="152" cy="76" r="3" fill="#e9c46a"/><circle cx="150" cy="58" r="3" fill="#e9c46a"/><circle cx="160" cy="66" r="2.5" fill="#e9c46a"/>${SP(58,62,9,'#e9c46a')}`},
{n:'بيت يلمع',d:'بيت فيه لمعة. معناه بيت نضيف ومرتّب، شكل دافي وعائلي.',c:['#22427c','#132650','#d4af5a'],s:`<defs><linearGradient id="a5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f5aa6"/><stop offset="1" stop-color="#132650"/></linearGradient></defs><circle cx="100" cy="100" r="100" fill="url(#a5)"/><path d="M50 100L100 58l50 42" stroke="#d4af5a" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 92v54a6 6 0 0 0 6 6h64a6 6 0 0 0 6-6V92" stroke="#fff" stroke-width="8" fill="none" stroke-linejoin="round"/>${SP(100,118,20,'#d4af5a')}${SP(124,100,7,'#fff')}`},
{n:'ورقة وقطرة',d:'ورقة شجر خضرا وقطرة مية. إحساس طبيعي وصحي وآمن.',c:['#f3f7ef','#3f7d3a','#1f8fb3'],s:`<circle cx="100" cy="100" r="100" fill="#f3f7ef"/><circle cx="100" cy="100" r="90" fill="none" stroke="#3f7d3a" stroke-width="2.5"/><path d="M58 140C52 92 86 56 146 52c4 58-30 92-88 88z" fill="#3f7d3a"/><path d="M62 136C86 112 106 92 134 66" stroke="#f3f7ef" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M124 96s-18 22-18 34a18 18 0 0 0 36 0c0-12-18-34-18-34z" fill="#1f8fb3" stroke="#f3f7ef" stroke-width="4"/>`},
{n:'اسم بالعربي',d:'«سوبر كلين» بخط كوفي حديث ولمعة على الكاف. شكل محلي وأنيق.',c:['#0b2a33','#c6a15b','#f7f3ea'],s:`<rect width="200" height="200" rx="100" fill="#0b2a33"/><text x="100" y="102" text-anchor="middle" font-family="Reem Kufi" font-weight="700" font-size="40" fill="#f7f3ea">سوبر كلين</text><path d="M52 118h96" stroke="#c6a15b" stroke-width="2"/><text x="100" y="140" text-anchor="middle" font-family="Marcellus" font-size="13" fill="#c6a15b" letter-spacing="4">SUPER CLEAN</text>${SP(66,62,10,'#c6a15b')}`},
{n:'لمعة نجمة',d:'لمعة كبيرة واحدة جوه دايرة دهبي. أبسط شكل وأشيك، بيبان كويس حتى لو صغير.',c:['#151412','#c9a24a','#ffffff'],s:`<defs><linearGradient id="g8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dfa6"/><stop offset="1" stop-color="#a67c2e"/></linearGradient></defs><circle cx="100" cy="100" r="100" fill="#151412"/><circle cx="100" cy="100" r="70" fill="none" stroke="url(#g8)" stroke-width="3"/>${SP(100,100,50,'url(#g8)')}${SP(140,62,10,'#fff')}${SP(64,138,6,'#f3dfa6')}`},
];
g.innerHTML=L.map((l,k)=>`<div class="c"><span class="n">${k+1}</span><svg class="big" viewBox="0 0 200 200">${l.s.replace(/id="(\w+)"/g,'id="$1b"').replace(/url\(#(\w+)\)/g,'url(#$1b)')}</svg><b>${l.n}</b><small>${l.d}</small><div class="row"><div class="ic"><svg viewBox="12 12 176 176">${l.s}</svg></div>${l.c.map(c=>`<span class="sw" style="background:${c}"></span>`).join('')}</div></div>`).join('');
</script></body></html>
