.hello small{color:var(--muted);font-size:13px}
.hello .seg{margin:0}
.seg{border-radius:999px;background:var(--surface);box-shadow:var(--sh-1);padding:3px;gap:2px}
.seg button{border-radius:999px;transition:background .15s}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--hero2));color:var(--accent-ink)}
.kpis{gap:12px}
.kpi{border-color:color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--sh-1);border-radius:var(--rl);padding:14px;position:relative;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.kpi .ic svg{width:17px;height:17px}
.kpi .ic.good{background:var(--good-soft);color:var(--good)}.kpi .ic.bad{background:var(--bad-soft);color:var(--bad)}
.kpi .v{font-size:21px;margin-top:6px}
.kpi .d{font-size:11.5px;margin-top:2px;color:var(--muted)}
.kpi.hero{background:linear-gradient(135deg,var(--accent),var(--hero2));box-shadow:0 18px 40px -18px color-mix(in srgb,var(--accent) 80%,transparent);padding:20px}
.kpi.hero::after{content:"";position:absolute;inset-inline-start:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.kpi.hero::before{content:"";position:absolute;inset-inline-end:-40px;bottom:-90px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.08);pointer-events:none}
.kpi.hero .v{font-size:32px}
.row{border-color:color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--sh-1);border-radius:var(--rl);padding:12px 14px;transition:box-shadow .2s,transform .2s var(--ease)}
.row:hover{box-shadow:var(--sh-2)}
.row.st-bad{border-inline-start:3px solid var(--bad)}.row.st-warn{border-inline-start:3px solid var(--warn)}.row.st-good{border-inline-start:3px solid var(--good)}
.pill{padding:2px 10px;font-weight:700;font-size:11px}
.btn{border-radius:999px;padding:5px 13px;transition:transform .12s var(--ease),box-shadow .15s,background .15s}
.btn:hover{box-shadow:var(--sh-1)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--hero2));box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.wa{color:#128c4a;border-color:color-mix(in srgb,#25d366 45%,var(--line));display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.btn.wa svg{width:15px;height:15px}
:root[data-mode="dark"] .btn.wa{color:#4ade80}
@media (prefers-color-scheme: dark){:root:not([data-mode="light"]) .btn.wa{color:#4ade80}}
.btn.ghost{background:transparent}
.btn svg{width:15px;height:15px;vertical-align:-3px}
.bars{border-radius:var(--rl);box-shadow:var(--sh-1);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.bar .fill{background:linear-gradient(90deg,var(--hero2),var(--accent))}
.empty{border-radius:var(--rl);background:color-mix(in srgb,var(--surface) 50%,transparent)}
.panel{border-radius:var(--rl);box-shadow:var(--sh-1);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
input,select,textarea{border-radius:12px;transition:border-color .15s,box-shadow .15s;background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow);outline:none}
.fab{background:linear-gradient(135deg,var(--accent),var(--hero2));box-shadow:0 14px 30px -10px color-mix(in srgb,var(--accent) 85%,transparent),var(--sh-2);transition:transform .2s var(--ease),box-shadow .2s;padding:14px 22px}
.fab:hover{transform:translateY(-2px)}
.fab.alt{background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(8px);box-shadow:var(--sh-2)}
.sheet-bg{background:rgba(18,10,4,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{border-radius:24px 24px 0 0;box-shadow:var(--sh-3);padding-top:22px;position:relative}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:5px;background:var(--line)}
@media (min-width:700px){.sheet-bg{align-items:center;padding:24px}.sheet{border-radius:24px;max-height:88vh}.sheet::before{display:none}}
.preview{border-radius:12px}
#toast{position:fixed;inset-inline:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 12px);z-index:30;margin:0 auto;max-width:520px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);padding:11px 16px;border-radius:16px;font-size:14px;box-shadow:var(--sh-3);backdrop-filter:blur(8px)}
#toast::before{content:"✓";display:grid;place-items:center;width:22px;height:22px;flex:0 0 auto;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}
#gate{background:radial-gradient(800px 420px at 50% -10%,var(--glow),transparent 70%),var(--bg)}
#gate .box{background:var(--surface);padding:26px 22px;border-radius:28px;box-shadow:var(--sh-3);margin-top:3vh}
#gate .btn.pri{border-radius:14px}
#gate img{box-shadow:0 0 0 4px var(--surface),0 0 0 5px color-mix(in srgb,var(--accent) 40%,transparent),0 12px 30px rgba(120,85,30,.25)}
/* today's to-do */
.todo{display:flex;flex-direction:column;gap:8px}
.todo .ti{display:grid;grid-template-columns:38px 1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border-radius:var(--rl);padding:10px 12px;box-shadow:var(--sh-1);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.todo .ti .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.todo .ti .ic svg{width:19px;height:19px}
.todo .ti.bad .ic{background:var(--bad-soft);color:var(--bad)}.todo .ti.warn .ic{background:var(--warn-soft);color:var(--warn)}
.todo .ti .t{font-weight:700;font-size:14px}.todo .ti .s{color:var(--muted);font-size:12.5px}
.todo .ti .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.todo .ti{grid-template-columns:38px 1fr}.todo .ti .acts{grid-column:1/-1;justify-content:flex-start;padding-inline-start:50px}}
.allgood{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--rl);background:var(--good-soft);color:var(--good);font-weight:500}
/* cash-in chart */
.chart{background:var(--surface);border-radius:var(--rl);box-shadow:var(--sh-1);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding:14px 14px 10px}
.chart .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chart .head b{font-size:20px}
.chart .cols{display:flex;align-items:flex-end;gap:4px;height:130px;direction:ltr}
.chart .col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.chart .col i{display:block;width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 45%,transparent));min-height:3px;transform-origin:bottom}
.chart .col.zero i{background:var(--line)}
.chart .col.now i{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.chart .col span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.chart .col i{animation:grow .6s var(--ease) both}@keyframes grow{from{transform:scaleY(0)}}}
.delta{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.delta.up{background:var(--good-soft);color:var(--good)}.delta.down{background:var(--bad-soft);color:var(--bad)}
/* reports */
.monthnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;box-shadow:var(--sh-1);padding:3px}
.monthnav b{min-width:9em;text-align:center;font-family:var(--f-display);font-weight:500}
.monthnav .btn{border:0;padding:4px 12px;font-size:16px}
.rank{display:flex;flex-direction:column;gap:10px}
.rank .r{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;font-size:14px}
.rank .r .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px}
.rank .r .tr{grid-column:2/-1;height:6px;border-radius:6px;background:var(--accent-soft);overflow:hidden;margin-top:-6px}
.rank .r .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--hero2),var(--accent))}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grid2 h3{margin-top:8px}
/* search */
.sbox{position:relative}
.sbox svg{position:absolute;inset-inline-start:12px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.sbox input{padding-inline-start:40px;font-size:16px;padding-block:12px}
.sres{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sres .grp{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}
.sres .row{box-shadow:none}
/* receipt */
.receipt{background:#fffdf8;color:#2a1f12;border-radius:18px;padding:22px 20px;border:1px solid #eadfca;font-size:14px;position:relative;overflow:hidden}
.receipt::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,#8a6420,#d9b36b,#8a6420)}
.receipt .rh{display:flex;align-items:center;gap:12px;border-bottom:1px dashed #d9c9a6;padding-bottom:12px;margin-bottom:12px}
.receipt .rh img{width:58px;height:58px;border-radius:50%}
.receipt .rh .nm{font-family:"Marcellus",Georgia,serif;font-size:22px;color:#8a6420;letter-spacing:.06em;line-height:1.1}
.receipt .rh small{display:block;color:#7a6a55;font-size:12px}
.receipt .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:#5a4a35;margin-bottom:12px}
.receipt table{width:100%;border-collapse:collapse;font-size:13.5px}
.receipt th{text-align:start;font-weight:700;color:#7a6a55;font-size:12px;border-bottom:1px solid #eadfca;padding:6px 4px}
.receipt td{padding:8px 4px;border-bottom:1px solid #f1e8d8}
.receipt .n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.receipt .tot{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.receipt .tot div{display:flex;justify-content:space-between}
.receipt .tot .big{font-size:18px;font-weight:700;color:#8a6420;border-top:1px dashed #d9c9a6;padding-top:8px;margin-top:4px}
.receipt .stamp{display:inline-block;margin-top:12px;padding:3px 14px;border:2px solid currentColor;border-radius:8px;font-weight:700;transform:rotate(-4deg)}
.receipt .stamp.ok{color:#2f7d55}.receipt .stamp.no{color:#b3412f}
.receipt .thanks{text-align:center;color:#7a6a55;font-size:12.5px;margin-top:14px;border-top:1px dashed #d9c9a6;padding-top:10px}
#printArea{display:none}
.phpick.big img{width:100%;max-width:340px;height:auto;aspect-ratio:auto;object-fit:contain}
.idimg{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#fff}
.srow{display:flex;gap:8px;align-items:stretch}.srow .sbox{flex:1}
.scam{display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:0 14px;font-size:15px}.scam svg{width:20px;height:20px}
.pcard.noimg{grid-template-columns:1fr}
.pname{background:none;border:0;padding:0;font:inherit;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 60%,transparent);text-underline-offset:4px;text-align:start}
.pname span{color:var(--accent);display:inline-block;transform:rotate(-90deg)}
.pacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.pacts .btn{padding:9px 18px;font-size:15px}
.ptap{font-size:12px;color:var(--accent);margin-top:6px}
.row.has-ph{grid-template-columns:64px 1fr auto}
.row.has-ph .acts,.row.has-ph .lines{grid-column:1/-1}
.row .thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;grid-row:span 1;border:1px solid var(--line)}
.phpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phpick img{width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.ppres{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ppshot{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.ppshot img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:2px dashed var(--accent)}
.pcard{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--sh-1)}
.pcard>img{width:110px;height:140px;object-fit:cover;border-radius:12px}
.pcard .t{font-weight:700}.pcard .big{font-size:20px;font-weight:700;color:var(--accent);margin-top:4px}.pcard .s{font-size:13px;color:var(--muted);margin-top:2px}
.pcard .acts{display:flex;gap:6px;margin-top:8px}
.pcard:first-of-type{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.vmicwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 14px}
.vmic{width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--hero2));box-shadow:0 14px 30px -10px color-mix(in srgb,var(--accent) 80%,transparent);position:relative;transition:transform .15s}
.vmic svg{width:42px;height:42px}
.vmic:active{transform:scale(.95)}
.vmic.on{background:linear-gradient(135deg,#d9534f,#a83232);color:#fff}
.vmic.on::before,.vmic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid #d9534f;opacity:.6;animation:vpulse 1.4s ease-out infinite}
.vmic.on::after{animation-delay:.7s}
@keyframes vpulse{from{transform:scale(.9);opacity:.7}to{transform:scale(1.45);opacity:0}}
.vstat{font-weight:700;color:var(--accent)}
.vops{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.vop{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.vop .vi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--good-soft);color:var(--good)}
.vop.bad .vi{background:var(--bad-soft);color:var(--bad)}
.vop.done{opacity:.7}
.vop .t{font-size:14px;font-weight:500}.vop .s{font-size:12.5px;color:var(--bad)}
.vex summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
html.sheet-open{overscroll-behavior-y:none}
.sheet{overscroll-behavior:contain}
.icon-btn.inst{background:linear-gradient(135deg,var(--accent),var(--hero2));color:var(--accent-ink);border-color:transparent;font-weight:700}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}.steps b{color:var(--accent)}

/* ---------- money logic ---------- */
const item=id=>S.items.find(x=>x.id===id)||{name:'(صنف اتمسح)',cost:0,price:0,rent:0};
const sup=id=>S.suppliers.find(x=>x.id===id)||{name:'(مورد اتمسح)'};
const stock=id=>sum(S.purchases.filter(p=>p.itemId===id),p=>p.qty)-sum(S.sales.filter(p=>p.itemId===id),p=>p.qty);
const paidOf=r=>sum(r.pays||[],p=>p.a);
const totalOf=(coll,r)=>coll==='sales'?r.qty*r.price:coll==='purchases'?r.qty*r.cost:r.price;
const restOf=(coll,r)=>totalOf(coll,r)-paidOf(r);
const inP=d=>period==='all'||(d||'').slice(0,7)===today().slice(0,7);
const restPill=rest=>rest<=0?'<span class="pill good">تمام</span>':`<span class="pill bad">باقي ${money(rest)}</span>`;
function instInfo(p){
  if(p.mode!=='inst'||!p.n)return'';
  const per=totalOf('purchases',p)/p.n,done=Math.min(p.n,Math.floor(paidOf(p)/per+0.001));
  if(done>=p.n)return `${p.n} أقساط خلصت`;
  const due=addMonths(p.date,done+1),late=due<today();
  return `قسط ${money(per)} · دفعت ${done} من ${p.n} · القسط الجاي ${fmtDate(due)}${late?' <span class="pill bad">متأخر</span>':''}`;
}
function totals(){
  const sl=S.sales.filter(x=>inP(x.date)),rn=S.rentals.filter(x=>inP(x.from)),ex=S.expenses.filter(x=>inP(x.date)),pu=S.purchases.filter(x=>inP(x.date));
  const salesRev=sum(sl,x=>x.qty*x.price),salesCost=sum(sl,x=>x.qty*x.cost),rentRev=sum(rn,x=>x.price)+sum(rn,x=>x.status==='back'?x.depIn-x.depOut:0),exp=sum(ex,x=>x.amount);
  const cashIn=(S.capital||0)+sum(S.sales,paidOf)+sum(S.rentals,paidOf)+sum(S.rentals,x=>x.depIn||0);
  const cashOut=sum(S.purchases,paidOf)+sum(S.expenses,x=>x.amount)+sum(S.rentals,x=>x.depOut||0);
  return {salesRev,grossSales:salesRev-salesCost,rentRev,exp,net:salesRev-salesCost+rentRev-exp,purch:sum(pu,x=>x.qty*x.cost),cash:cashIn-cashOut,
    deposits:sum(S.rentals.filter(r=>r.status==='out'),r=>r.depIn-r.depOut),
    custOwe:sum(S.sales,x=>Math.max(0,restOf('sales',x)))+sum(S.rentals,x=>Math.max(0,restOf('rentals',x))),
    supOwe:sum(S.purchases,x=>Math.max(0,restOf('purchases',x))),ex};
}

function monthStats(ym){
  const inM=d=>(d||'').slice(0,7)===ym;
  const sl=S.sales.filter(x=>inM(x.date)),rn=S.rentals.filter(x=>inM(x.from)),ex=S.expenses.filter(x=>inM(x.date)),pu=S.purchases.filter(x=>inM(x.date));
  const salesRev=sum(sl,x=>x.qty*x.price),salesCost=sum(sl,x=>x.qty*x.cost),rentRev=sum(rn,x=>x.price)+sum(rn,x=>x.status==='back'?x.depIn-x.depOut:0),exp=sum(ex,x=>x.amount);
  const cashIn=sum([...S.sales,...S.rentals],r=>sum((r.pays||[]).filter(p=>inM(p.d)),p=>p.a));
  return {sl,rn,salesRev,gross:salesRev-salesCost,rentRev,exp,net:salesRev-salesCost+rentRev-exp,cashIn,count:sl.length+rn.length};
}
function cashChart(days,cmp){
  const by={};[...S.sales,...S.rentals].forEach(r=>(r.pays||[]).forEach(p=>{by[p.d]=(by[p.d]||0)+(+p.a||0)}));
  const vals=days.map(d=>by[d]||0),mx=Math.max(1,...vals),tot=sum(vals,x=>x);
  let dp='';if(cmp){let pt=0;for(let i=cmp;i<2*cmp;i++)pt+=by[dayOff(-i)]||0;dp=deltaPill(tot,pt)+' <span class="hint" style="margin:0">عن الـ '+cmp+' يوم اللي قبلهم</span>'}
  const step=days.length>16?3:1;
  return `<div class="chart"><div class="head"><div><b class="num">${money(tot)}</b> <span class="hint" style="margin:0">اتقبضت من البيع والإيجار</span></div><div>${dp}</div></div>
  <div class="cols" role="img" aria-label="الفلوس اللي دخلت كل يوم">${days.map((d,i)=>`<div class="col${vals[i]?'':' zero'}${d===today()?' now':''}" title="${fmtDate(d)}: ${moneyT(vals[i])}"><i style="height:${Math.max(2,vals[i]/mx*88).toFixed(1)}%"></i><span>${(i%step===0||d===today())?+d.slice(8):'&nbsp;'}</span></div>`).join('')}</div></div>`;
}
function todoHtml(){
  const t0=today(),t1=dayOff(1),L=[];

  const sev=d=>d<t0?'bad':d===t0?'warn':'';
  if(can('rentals'))S.rentals.forEach(r=>{const nm=item(r.itemId).name;
    if(r.status==='booked'&&r.from<=t1)L.push({d:r.from,k:sev(r.from),i:'hand',t:`تسليم ${nm}`,s:`${esc(r.customer)} · ${when(r.from)} · الباقي ${money(restOf('rentals',r))} + تأمين ${money(r.deposit)}`,
      a:`<button class="btn pri" data-hand="${r.id}">سلّمت</button>${waBtn(r.phone,`أهلاً ${r.customer} 🌸\nمعاد استلام ${nm} من حور ${r.from<t0?'كان يوم '+fmtFull(r.from):r.from===t0?'النهارده':'بكرة'}.\nمستنيينك ✨`,'فكّرها')}`});
    if(r.status==='out'&&r.to<=t1)L.push({d:r.to,k:sev(r.to),i:'back',t:`رجوع ${nm}`,s:`${esc(r.customer)} · ${when(r.to)} · تأمين معاك ${money(r.depIn)}`,
      a:`<button class="btn pri" data-back="${r.id}">رجع</button>${waBtn(r.phone,`أهلاً ${r.customer} 🌸\nبنفكّرك إن معاد رجوع ${nm} ${r.to<t0?'كان يوم '+fmtFull(r.to):r.to===t0?'النهارده':'بكرة'}.\nشكراً لاختيارك حور ✨`,'فكّرها')}`});
  });
  if(can('purchases'))S.purchases.forEach(p=>{if(p.mode!=='inst'||!p.n||restOf('purchases',p)<=0)return;const per=totalOf('purchases',p)/p.n,done=Math.floor(paidOf(p)/per+0.001);if(done>=p.n)return;
    const due=addMonths(p.date,done+1);if(due>dayOff(3))return;
    L.push({d:due,k:due<t0?'bad':'warn',i:'cash',t:`قسط ${money(per)} لـ ${esc(sup(p.supplierId).name)}`,s:`${esc(item(p.itemId).name)} · ${due<t0?'متأخر من '+fmtDate(due):'معاده '+fmtDate(due)}`,a:`<button class="btn pri" data-pay="purchases:${p.id}">دفعت</button>`})});
  L.sort((a,b)=>a.d.localeCompare(b.d));
  if(!L.length)return `<div class="allgood">${ic('check')}مفيش حاجة مستعجلة النهارده ولا بكرة</div>`;
  return `<div class="todo">${L.map(x=>`<div class="ti ${x.k}"><div class="ic">${ic(x.i)}</div><div><div class="t">${x.t}</div><div class="s num">${x.s}</div></div><div class="acts">${x.a}</div></div>`).join('')}</div>`;
}

/* ---------- back button, refresh and swipe-down ----------
   Each section and each open window is a step in the browser history, so the phone's back gesture
   closes the open window first, then goes back section by section to the home page. */
let skipPop=false;
const hs=()=>history.state||{};
function goTab(k){
  const open=!!$('#sheetRoot').firstChild;
  if(open){closeForm(true);history.replaceState({tab:k,d:(hs().d||0)+(k===tab?0:1)},'','#'+k)}
  else if(k!==tab){if(k==='home'&&hs().d>0){history.go(-hs().d);return}history.pushState({tab:k,d:(hs().d||0)+1},'','#'+k)}
  tab=k;render();scrollTo(0,0)}
function initHistory(){
  if(hs().tab)return;   // reload: the browser kept our steps
  history.replaceState({tab:'home',d:0},'','#home');
  if(tab!=='home')history.pushState({tab,d:1},'','#'+tab)}
addEventListener('popstate',e=>{
  if(skipPop){skipPop=false;if(hs().tab!==tab)history.replaceState({...hs(),tab},'','#'+tab);return}
  if($('#sheetRoot').firstChild){closeForm(true);return}
  const st=e.state||{};if(st.sheet||!st.tab)return;
  if(st.tab!==tab){tab=st.tab;render();scrollTo(0,0)}});
new MutationObserver(()=>{const open=!!$('#sheetRoot').firstChild;document.documentElement.classList.toggle('sheet-open',open);
  if(open&&!hs().sheet)history.pushState({sheet:1,tab,d:hs().d||0},'',location.hash)}).observe($('#sheetRoot'),{childList:true});
(()=>{let st=null;   // drag a window down to close it
  document.addEventListener('touchstart',e=>{const sh=e.target.closest&&e.target.closest('.sheet');st=sh&&sh.scrollTop<=0?{sh,y:e.touches[0].clientY,x:e.touches[0].clientX,dy:0,on:false}:null},{passive:true});
  document.addEventListener('touchmove',e=>{if(!st)return;const t=e.touches[0],dy=t.clientY-st.y,dx=t.clientX-st.x;
    if(!st.on){if(dy>8&&dy>Math.abs(dx)&&st.sh.scrollTop<=0)st.on=true;else{if(dy<-4||Math.abs(dx)>10)st=null;return}}
    st.dy=Math.max(0,dy);st.sh.style.transition='none';st.sh.style.transform=`translateY(${st.dy}px)`;st.sh.parentElement.style.background=`rgba(18,10,4,${Math.max(.05,.42-st.dy/900)})`;if(e.cancelable)e.preventDefault()},{passive:false});
  document.addEventListener('touchend',()=>{if(!st)return;const{sh,dy,on}=st;st=null;if(!on)return;sh.style.transition='transform .2s ease';
    if(dy>100){sh.style.transform='translateY(110%)';setTimeout(()=>closeForm(),170)}else{sh.style.transform='';sh.parentElement.style.background=''}});
})();

/* ---------- item photos and "find the price from a photo" ----------
   Photos are shrunk on the phone and saved inside the item (encrypted like everything else).
   Matching is done on the phone too: colour mix + rough shape, compared with every item photo. Nothing is sent anywhere. */
const okImg=x=>typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x);
function pickImage(capture,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';if(capture)i.setAttribute('capture','environment');i.style.display='none';document.body.appendChild(i);
  i.onchange=()=>{const f=i.files&&i.files[0];i.remove();if(f)cb(f)};i.click();setTimeout(()=>{if(i.isConnected&&!i.files.length)i.remove()},120000)}
function shrinkImage(file,max=360,q=.62){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('الصورة دي مش مقروءة، جرّب صورة تانية'))};im.src=u})}
const SIGC=new Map();
function imgSig(src){if(SIGC.has(src))return Promise.resolve(SIGC.get(src));return new Promise(ok=>{const im=new Image();
  im.onload=()=>{const N=32,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});const cw=im.width*.7,chh=im.height*.7;
    x.drawImage(im,(im.width-cw)/2,(im.height-chh)/2,cw,chh,0,0,N,N);const d=x.getImageData(0,0,N,N).data;const h=new Array(28).fill(0),g=[];
    for(let q=0;q<N*N;q++){const r=d[q*4]/255,G=d[q*4+1]/255,b=d[q*4+2]/255,mx=Math.max(r,G,b),mn=Math.min(r,G,b),sat=mx?(mx-mn)/mx:0;let bin;
      if(sat<.2)bin=24+Math.min(3,Math.floor(mx*4));else{const dd=mx-mn;let hh=mx===r?((G-b)/dd+6)%6:mx===G?(b-r)/dd+2:(r-G)/dd+4;bin=Math.min(11,Math.floor(hh*2))*2+(mx<.5?0:1)}h[bin]++}
    for(let yy=0;yy<8;yy++)for(let xx=0;xx<8;xx++){let t=0;for(let a=0;a<4;a++)for(let e=0;e<4;e++){const q=((yy*4+a)*N+xx*4+e)*4;t+=d[q]*.299+d[q+1]*.587+d[q+2]*.114}g.push(t/16)}
    const m=g.reduce((a,b)=>a+b,0)/64,sd=Math.sqrt(g.reduce((a,b)=>a+(b-m)**2,0)/64)||1;
    const sig={h:h.map(v=>v/(N*N)),g:g.map(v=>(v-m)/sd)};SIGC.set(src,sig);ok(sig)};
  im.onerror=()=>ok(null);im.src=src})}
const simSig=(a,b)=>{let hi=0,c=0;for(let i=0;i<28;i++)hi+=Math.min(a.h[i],b.h[i]);for(let i=0;i<64;i++)c+=a.g[i]*b.g[i];return .75*hi+.25*(c/64+1)/2};

const EXP_WORDS=[['كهرب','كهرباء ومياه'],['مياه','كهرباء ومياه'],['مرتب','مرتبات'],['ايجار المحل','إيجار المحل'],['نقل','نقل بضاعة'],['شنط','شنط وتغليف'],['تغليف','شنط وتغليف'],['دعاي','دعاية'],['اعلان','دعاية'],['صيان','صيانة']];
const norm=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة(?=\s|$)/g,'ه').replace(/(\d),(\d)/g,'$1$2').replace(/جنيه|ج\.م/g,' ').replace(/\s+/g,' ').trim();
function numAfter(t,words){for(const w of words){const m=t.match(new RegExp('(?:^|\\s)(?:و)?'+w+'\\s*(?:ب|بـ)?\\s*(\\d+(?:\\.\\d+)?)'));if(m)return +m[1]}return null}
function parseCmd(raw){
  const t=norm(raw);if(!t)return {err:'اكتب أو قول الأمر الأول'};
  let best=null,score=0;
  S.items.forEach(i=>{const ws=norm(i.name).split(' ').filter(w=>w.length>2);const s=ws.filter(w=>t.includes(w)).length/ws.length+(ws.filter(w=>t.includes(w)).length?0.01*ws.length:0);if(s>score){score=s;best=i}});
  const expHit=EXP_WORDS.find(([w])=>t.includes(w));
  let type=null;
  if(/(اجر|ايجار|تاجير|حجز|حجزت)/.test(t)&&!/ايجار المحل/.test(t))type='rentals';
  else if(/(بعت|بيع|اتباع|باع)/.test(t))type='sales';
  else if(/(وارد|اشتريت|استلمت بضاعه|جالي من)/.test(t))type='purchases';
  else if(expHit||/(مصروف|صرفت)/.test(t))type='expenses';
  if(!type)return {err:'مش فاهم العملية. ابدأ بكلمة زي: بعت، أجّرت، حجز، مصروف، وارد.'};
  const total=numAfter(t,['بسعر','بمبلغ','ب','بـ','الايجار','سعره','سعرها']);
  let paid=numAfter(t,['دفعت','دفع','عربون','مقدم','العربون','دافعه','دافع']);
  const rest=numAfter(t,['متبقي','الباقي','باقي','فاضل']);
  const qm=t.match(/(\d+)\s*(?:قطعه|قطع|حته|حتت)/)||t.match(/(?:بعت|بيع)\s*(\d+)\s/);const qty=qm?+qm[1]:1;
  if(paid==null&&rest!=null&&total!=null)paid=(type==='sales'?total*qty:total)-rest;
  raw=raw.replace(/لل?عروس[ةه]\s*/,'للعميلة العروسة ');
  const cm=raw.match(/(?:للعميله|للعميلة|للعميل|العميله|العميلة|العميل|لـ|اسمها|اسمه)\s*([^\s\d،,.]+(?:\s(?!ب|بـ|بسعر|و|دفع|دفعت)[^\s\d،,.]+)?)/)||raw.match(/(?:^|\s)ل(?!مدة|مده)([^\s\d،,.]{3,}(?:\s(?:محمد|احمد|أحمد|علي|حسن|محمود|خالد|[^\s\d،,.]{3,}(?=\s|$)))?)/);
  let customer=cm?cm[1].trim():'';customer=customer.replace(/\s(ب|بـ|بسعر|دفع.*|و.*)$/,'');
  if(type==='expenses'){const amount=numAfter(t,['مصروف\\s*[^\\d]*','صرفت','ب','بـ'])||(t.match(/(\d+)/)||[])[1];
    return {type,preset:{type:expHit?expHit[1]:'أخرى',amount:amount||'',note:raw.trim()}};}
  if(!best)return {err:'مش لاقي الصنف ده في الأصناف. قول اسم الصنف زي ما هو متسجل.'};
  if(type==='rentals'){if(!best.rent){const d=S.items.find(i=>i.rent&&norm(i.name).split(' ').some(w=>w.length>2&&t.includes(w)));if(d)best=d;else return {err:'الصنف ده مش متسجل كفستان إيجار'}}
    return {type,preset:{itemId:best.id,customer,price:total??best.rent,paid:paid??''}};}
  if(type==='sales')return {type,preset:{itemId:best.id,customer,qty,price:total??best.price,paid:paid??''}};
  return {type,preset:{itemId:best.id,qty,cost:total??best.cost,paid:paid??''}};
}

function splitCmds(raw){

    await this.init();
    const cred=await this.auth.createUserWithEmailAndPassword(toEmail(user),pw);const uidMe=cred.user.uid;
    const key=await CR.newKey(),raw=await CR.exp(key);
    const b=this.db.batch();
    b.set(this.db.doc('meta/shop'),{owner:uidMe,name:'حور',created:Date.now(),check:await CR.enc(key,CHECK)});
    b.set(this.db.doc('members/'+uidMe),{name,username:user.trim(),role:'manager',active:true});
    b.set(this.db.doc('keys/'+uidMe),await CR.enc(await CR.derive(pw,uidMe),raw));
    try{await b.commit()}catch(e){try{await cred.user.delete()}catch(x){}throw new Error('المحل متجهّز قبل كده. ادخل باسم المستخدم بتاعك، أو اطلب من المدير يعملك حساب.')}
    await this.finishLogin(uidMe,{name,role:'manager',username:user.trim()},raw);return raw},
  async addMember(name,user,pw,role){
    if(!navigator.onLine)throw new Error('لازم نت علشان تضيف مستخدم');
    const sec=firebase.apps.find(a=>a.name==='adder')||firebase.initializeApp(CFG,'adder');const sa=sec.auth();if(EMU&&!sa.emulatorConfig)sa.useEmulator('http://127.0.0.1:9099',{disableWarnings:true});
    const cred=await sa.createUserWithEmailAndPassword(toEmail(user),pw);const nu=cred.user.uid;await sa.signOut();
    const b=this.db.batch();
    b.set(this.db.doc('members/'+nu),{name,username:user.trim(),role,active:true});
    b.set(this.db.doc('keys/'+nu),await CR.enc(await CR.derive(pw,nu),await CR.exp(this.key)));
    await b.commit()},
  setActive(id,on){this.db.doc('members/'+id).update({active:on}).then(()=>{toast(on?'الحساب اتفتح':'الحساب اتقفل، مش هيقدر يدخل أو يشوف حاجة');logA((on?'فتح':'قفل')+' حساب '+(MEM.find(m=>m.id===id)||{}).name);save()}).catch(e=>toast(fbErr(e)))},
  async changePw(oldPw,newPw){
    const u=this.auth.currentUser;if(!u)throw new Error('لازم نت');
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,oldPw));
    await u.updatePassword(newPw);
    await this.db.doc('keys/'+u.uid).set(await CR.enc(await CR.derive(newPw,u.uid),await CR.exp(this.key)))},
  async recoveryCode(){return CR.exp(this.key)},
  logout(msg){
    this.unsubs.forEach(f=>f());this.unsubs=[];if(this.memUnsub)this.memUnsub();
    if(SESSION)ls.set(RK+'key_'+SESSION.uid,'');['session','cache','synced'].forEach(k=>ls.set(RK+k,''));
    const done=()=>{if(msg)ls.set(RK+'msg',msg);location.reload()};
    if(this.auth)this.auth.signOut().then(done,done);else done()},
};

/* ---------- login / first-time setup screen ---------- */

  ${mode==='setup'?`<p class="hint">للمدير بس، ومرة واحدة. بعدها المدير يضيف البياعين من الإعدادات.</p>
    <div class="field"><label for="g_name">اسمك</label><input id="g_name" autocomplete="name"></div>`:''}
  <div class="field"><label for="g_user">اسم الدخول${mode==='setup'?' (ممكن إيميلك، علشان لو نسيت الباسورد)':''}</label><input id="g_user" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
  <div class="field"><label for="g_pw">الباسورد</label><input id="g_pw" type="password" autocomplete="${mode==='setup'?'new-password':'current-password'}"></div>
  ${mode==='setup'?'<div class="field"><label for="g_pw2">اكتب الباسورد تاني</label><input id="g_pw2" type="password" autocomplete="new-password"></div>':''}
  <div id="g_extra"></div><p class="err" id="g_err">${esc(msg||'')}</p>
  <button class="btn pri" type="submit" style="padding:11px;font-size:16px">${mode==='setup'?'جهّز المحل':'دخول'}</button>
  ${mode==='setup'?'<button class="link" type="button" id="g_switch">عندي حساب، رجّعني للدخول</button>':`<button class="link" type="button" id="g_switch">أول مرة؟ جهّز المحل (للمدير)</button><button class="link" type="button" id="g_forgot">نسيت الباسورد</button>`}</form>`;
  $('#g_switch').onclick=()=>{g.dataset.mode=mode==='setup'?'login':'setup';showGate()};
  const err=$('#g_err');
  const fg=$('#g_forgot');if(fg)fg.onclick=async()=>{const u=$('#g_user').value.trim();
    if(!u.includes('@')){err.textContent='البياع: كلّم المدير يعملك حساب جديد. المدير: اكتب إيميلك في اسم الدخول ودوس تاني.';return}
    try{await SYNC.init();SYNC.auth.languageCode='ar';await SYNC.auth.sendPasswordResetEmail(u);err.textContent='اتبعتلك لينك على الإيميل. بعد ما تغيّر الباسورد، ادخل وهيطلب منك كود الاسترجاع.'}catch(e){err.textContent=fbErr(e)}};
  $('#gateForm').onsubmit=async e=>{e.preventDefault();err.textContent='لحظة…';
    const user=$('#g_user').value.trim(),pw=$('#g_pw').value;
    try{
      if(g.dataset.code){const info=JSON.parse(g.dataset.code);info.pw=pw;await SYNC.useCode(info,$('#g_code').value);delete g.dataset.code;return enterApp()}
      if(!user||!pw)throw new Error('اكتب اسم الدخول والباسورد');
      if(mode==='setup'){const name=$('#g_name').value.trim();if(!name)throw new Error('اكتب اسمك');if(pw.length<6)throw new Error('الباسورد لازم 6 حروف أو أرقام على الأقل');if(pw!==$('#g_pw2').value)throw new Error('الباسورد مش زي بعضه');
        const raw=await SYNC.setup(name,user,pw);
        g.innerHTML=`<div class="box"><img src="logo.svg" alt="" width="150" height="150"><h2>المحل اتجهّز</h2><p class="hint">ده <b>كود الاسترجاع</b>. لو نسيت الباسورد في يوم، الكود ده هو اللي هيفتح بيانات المحل. اكتبه في ورقة وشيله في مكان أمان، وما تبعتهوش لحد.</p><div class="code">${esc(raw)}</div><button class="btn" id="g_copy">انسخ الكود</button><button class="btn pri" id="g_go" style="padding:11px;font-size:16px">كتبته، ادخل على التطبيق</button></div>`;

function enterApp(){const g=$('#gate');if(g)g.remove();tab='home';render();SYNC.start()}

/* ---------- backups on this device ---------- */
function saveFile(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function downloadBackup(auto){saveFile(`shop-demo-${today()}.json`,new Blob([JSON.stringify({app:'shop-demo',v:1,at:new Date().toISOString(),data:S},null,1)],{type:'application/json'}));ls.set(RK+'lastbak',today());if(!auto)toast('اتحفظت النسخة في فولدر التنزيلات')}
function autoBackup(force){if(ls.get(RK+'autobak')!=='1')return;if(!force&&ls.get(RK+'lastbak')===today())return;downloadBackup(true);toast('اتحفظت نسخة النهارده على الجهاز ده (فولدر التنزيلات)')}
function downloadCSV(){
  const rows=[['النوع','التاريخ','الاسم','الصنف','العدد','الإجمالي','المدفوع','الباقي','طريقة الدفع','سجّلها']];
  S.sales.forEach(x=>rows.push(['بيع',x.date,x.customer,item(x.itemId).name,x.qty,totalOf('sales',x),paidOf(x),restOf('sales',x),'',x.by]));
  S.rentals.forEach(x=>rows.push(['إيجار',x.from,x.customer,item(x.itemId).name,1,x.price,paidOf(x),restOf('rentals',x),'تأمين '+(x.depIn||0),x.by]));
  S.purchases.forEach(x=>rows.push(['وارد',x.date,sup(x.supplierId).name,item(x.itemId).name,x.qty,totalOf('purchases',x),paidOf(x),restOf('purchases',x),MODES[x.mode],x.by]));
  S.expenses.forEach(x=>rows.push(['مصروف',x.date,x.type,x.note||'','',x.amount,x.amount,0,'',x.by]));
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  saveFile(`shop-demo-${today()}.csv`,new Blob([csv],{type:'text/csv'}));toast('اتحفظ ملف Excel في التنزيلات')}
function restoreFrom(file){if(!file)return;const msg=$('#restoreMsg');const fr=new FileReader();
  fr.onload=()=>{let j;try{j=JSON.parse(fr.result)}catch(e){msg.textContent='الملف ده مش نسخة من التطبيق';return}
    const d=j&&j.data;if(!d||!Array.isArray(d.sales)){msg.textContent='الملف ده مش نسخة من التطبيق';return}
    const n=COLLS.reduce((a,c)=>a+(d[c]||[]).length,0);
    msg.innerHTML=`النسخة دي من ${esc((j.at||'').slice(0,10))} وفيها ${n} عملية. اللي ناقص بس هيتضاف، ومفيش حاجة هتتمسح. <button class="btn pri" id="doRestore">رجّعها</button>`;
    $('#doRestore').onclick=()=>{let added=0;COLLS.forEach(c=>(d[c]||[]).forEach(r=>{if(!r.id)r.id=uid();if(!S[c].some(x=>x.id===r.id)){S[c].push(r);added++}}));logA(`رجّع ${added} عملية من نسخة احتياطية`);save();render();toast(`اترجّعت ${added} عملية`)}};
  fr.readAsText(file)}

/* ---------- start ---------- */
function boot(){
  try{const uv=sessionStorage.getItem('shopdemo_updated');if(uv){sessionStorage.removeItem('shopdemo_updated');setTimeout(()=>toast('اتحدّث التطبيق لآخر إصدار ('+APP_VERSION+')'),2200)}}catch(e){}
  if(REAL){$('#footNote').textContent='بيانات المحل متشفّرة ومتزامنة بين كل الأجهزة.';
    const m=ls.get(RK+'msg');if(m)ls.set(RK+'msg','');
    if(!SESSION||!ls.get(RK+'key_'+SESSION.uid)){SESSION=null;render();showGate(m);return}
    render();SYNC.start();
  }else{render();setTimeout(autoBackup,2500)}
  syncUI();
}

/* ---------- render & events ---------- */
function render(){
  if(!tabsFor().some(([k])=>k===tab))tab=tabsFor()[0][0];
  ls.set(KEY+'_tab',tab);
  $('#demoWho').hidden=REAL;$('#realWho').hidden=!REAL;if(REAL&&SESSION)$('#realWho').textContent=me().name+' · '+me().role;
  if(!REAL)$('#meSel').innerHTML=S.users.map(u=>`<option value="${u.id}" ${u.id===me().id?'selected':''}>${esc(u.name)} (${u.role})</option>`).join('');
  $('#tabs').innerHTML=tabsFor().map(([k,l])=>`<button class="tab" data-tab="${k}" aria-current="${k===tab}">${tabIcon(k)}<span>${l}</span></button>`).join('');
  const vw=$('#view');vw.innerHTML=VIEWS[tab]();if(tab!==lastTab){vw.classList.remove('enter');void vw.offsetWidth;vw.classList.add('enter');lastTab=tab}
  const labels={home:'+ بيع',customers:'+ بيع',items:'+ صنف',purchases:'+ وارد',sales:'+ بيع',rentals:'+ حجز فستان',expenses:'+ مصروف',suppliers:'+ مورد'};
  $('#fab').hidden=!labels[tab];$('#fab').textContent=labels[tab]||'';
  const cq=$('#custQ');if(cq)cq.oninput=()=>{custQ=cq.value;const pos=cq.selectionStart;render();const n=$('#custQ');n.focus();n.setSelectionRange(pos,pos)};
  const q=$('#itemQ');if(q){q.oninput=()=>{itemQ=q.value;const pos=q.selectionStart;render();const n=$('#itemQ');n.focus();n.setSelectionRange(pos,pos)};$('#itemCat').onchange=e=>{itemCat=e.target.value;render()}}
  const rb=$('#resetBtn');if(rb){rb.onclick=()=>{if(!rb.classList.contains('armed')){rb.classList.add('armed');rb.textContent='متأكد؟ كل حاجة هتتمسح. دوس تاني';return}
    const u=me();S={v:2,demo:false,capital:0,users:[{...u,role:'مدير'}],suppliers:[],items:[],purchases:[],sales:[],rentals:[],expenses:[],log:[]};meId=u.id;ls.set(KEY+'_me',meId);save();tab='suppliers';render();toast('اتمسحت الأمثلة. ابدأ بإضافة مورد.')};
    $('#sampleBtn').onclick=()=>{S=seed();meId='u1';ls.set(KEY+'_me',meId);save();tab='home';render()}}
  const ab=$('#autoBak');if(ab){ab.onchange=()=>{ls.set(RK+'autobak',ab.checked?'1':'0');if(ab.checked)autoBackup(true)};$('#bakNow').onclick=()=>downloadBackup();$('#csvNow').onclick=downloadCSV;
    const rf=$('#restoreFile');if(rf)rf.onchange=()=>restoreFrom(rf.files[0])}
  const ub=$('#updBtn');if(ub)ub.onclick=()=>checkUpdate(true);
  const lo=$('#logoutBtn');if(lo)lo.onclick=()=>{if(!lo.classList.contains('armed')){lo.classList.add('armed');lo.textContent=SYNC.pending?'فيه حاجات لسه ما اترفعتش! دوس تاني للخروج':'متأكد؟ دوس تاني';return}SYNC.logout()};
  const sc=$('#showCode');if(sc)sc.onclick=async()=>{$('#codeBox').innerHTML=`<p class="hint">الكود ده بيفتح بيانات المحل لو المدير نسي الباسورد. اكتبه في ورقة وشيله في مكان أمان، وما تبعتهوش لحد.</p><div class="code">${esc(await SYNC.recoveryCode())}</div>`};
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){goTab(d.tab);return}
  if(d.install){doInstall();return}
  if(d.idph){openIdCard(d.idph);return}
  if(d.pname){const a=b.closest('.pcard').querySelector('.pacts'),t=b.closest('.pcard').querySelector('.ptap');a.hidden=!a.hidden;if(t)t.hidden=!a.hidden;return}
  if(d.photoprice){openPhotoPrice();return}
  if(d.itemph){setItemPhoto(d.itemph);return}
  if(d.pbook){openForm('rentals',{itemId:d.pbook});return}
  if(d.psell){openForm('sales',{itemId:d.psell,qty:1});return}
  if(d.receipt){const[coll,id]=d.receipt.split(':');openReceipt(coll,id);return}
  if(d.month){repMonth=shiftMonth(repMonth,+d.month);if(repMonth>today().slice(0,7))repMonth=today().slice(0,7);render();return}
  if(d.print){window.print();return}
  if(d.period){period=d.period;render();return}
  if(d.loguser!==undefined){logUser=d.loguser;render();return}
  if(d.look){const[k,v]=d.look.split(':');look[k]=v;applyLook();render();return}
  if(d.open){openForm(d.open,d.open==='capital'?{amount:S.capital}:{});return}
  if(d.pay){const[coll,id]=d.pay.split(':');const r=S[coll].find(x=>x.id===id);if(r)openForm('pay',{amount:restOf(coll,r)},{coll,r});return}
  if(d.suppay){const rest=sum(S.purchases.filter(p=>p.supplierId===d.suppay),p=>restOf('purchases',p));openForm('suppay',{amount:rest},d.suppay);return}
  if(d.hand){const r=S.rentals.find(x=>x.id===d.hand);openForm('hand',{amount:restOf('rentals',r),dep:r.deposit},r);return}
  if(d.back){const r=S.rentals.find(x=>x.id===d.back);openForm('back',{dep:r.depIn},r);return}
  if(d.move){const[k,dir]=d.move.split(':');const vis=tabsFor().map(t=>t[0]);const i=vis.indexOf(k),j=i+(+dir);if(i<0||j<0||j>=vis.length)return;
    const o=tabOrder();const a=o.indexOf(vis[i]),c=o.indexOf(vis[j]);[o[a],o[c]]=[o[c],o[a]];ls.set(ORDER_KEY,JSON.stringify(o));render();
    const nb=document.querySelector(`[data-move="${k}:${dir}"]`)||document.querySelector(`[data-move="${k}:${-dir}"]`);nb&&nb.focus();return}
  if(d.orderreset){ls.set(ORDER_KEY,'');render();toast('رجع الترتيب الأصلي');return}
  if(d.perms){openPerms(d.perms);return}
  if(d.active){const[id,on]=d.active.split(':');SYNC.setActive(id,on==='1');return}
  if(d.deluser){S.users=S.users.filter(u=>u.id!==d.deluser);save();render();return}
  if(d.del){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='متأكد؟ دوس تاني';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='حذف'}},3000);return}
    const [coll,id]=d.del.split(':');
    if(coll==='items'&&(S.purchases.some(p=>p.itemId===id)||S.sales.some(p=>p.itemId===id)||S.rentals.some(p=>p.itemId===id))){b.textContent='الصنف ليه حركة';return}
    if(coll==='suppliers'&&(S.items.some(p=>p.supplierId===id)||S.purchases.some(p=>p.supplierId===id))){b.textContent='المورد ليه أصناف';return}
    S[coll]=S[coll].filter(x=>x.id!==id);logA('حذف من '+(ALL_TABS.find(t=>t[0]===coll)||['',coll])[1]);save();render();return}
});

  else if(REAL&&!SYNC.live){t='بيتصل…';off=true}
