name: cib-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sL -A "$UA" -o p.html https://www.cibeg.com/en/currency-converter
          grep -oE '.{0,300}/api/currency/rates.{0,300}' p.html | head -3
          grep -oE '.{0,200}exchange-rates-.{0,200}' p.html | head -3
          echo "=== GET"; curl -s -A "$UA" -H "Accept: application/json" -w "\n%{http_code}\n" https://www.cibeg.com/api/currency/rates | head -c 3000
          echo; echo "=== POST"; curl -s -A "$UA" -X POST -H "Content-Type: application/json" -H "Accept: application/json" -d '{}' -w "\n%{http_code}\n" https://www.cibeg.com/api/currency/rates | head -c 3000
