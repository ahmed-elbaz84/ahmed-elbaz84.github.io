# Copies CIB's dollar rate into rate.json every 30 minutes, so the app can read it from its own site.
name: CIB dollar rate
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: cib-rate
jobs:
  rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read CIB rate
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -D headers.txt -A "$UA" -H "Accept: application/json" --max-time 30 https://www.cibeg.com/api/currency/rates -o raw.json
          grep -i "access-control" headers.txt || echo "no CORS header"
          buy=$(jq -r '.rates[]|select(.currencyID=="USD")|.buyRate' raw.json)
          sell=$(jq -r '.rates[]|select(.currencyID=="USD")|.sellRate' raw.json)
          echo "USD buy=$buy sell=$sell"
          if ! [[ "$buy" =~ ^[0-9]+(\.[0-9]+)?$ && "$sell" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then echo "CIB did not return a rate"; exit 1; fi
          old=$(jq -r '"\(.buy) \(.sell)"' rate.json 2>/dev/null || echo "")
          changed=$(jq -r '.changed // empty' rate.json 2>/dev/null || true)
          if [ "$old" != "$buy $sell" ] || [ -z "$changed" ]; then changed=$(date -u +%Y-%m-%dT%H:%M:%SZ); fi
          jq -n --argjson buy "$buy" --argjson sell "$sell" --arg changed "$changed" \
            '{bank:"CIB",currency:"USD",buy:$buy,sell:$sell,changed:$changed}' > rate.json
          cat rate.json
      - name: Save if the rate changed
        run: |
          if git ls-files --error-unmatch rate.json >/dev/null 2>&1 && git diff --quiet -- rate.json; then echo "Rate unchanged"; exit 0; fi
          git config user.name "cib-rate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "CIB dollar rate $(jq -r '"\(.buy) / \(.sell)"' rate.json)"
          git push
