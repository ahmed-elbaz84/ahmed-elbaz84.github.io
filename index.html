<style>
/* Layout: one phone-width column, sticky month header, bottom tab bar, bottom sheet for adding */
:root{
  --bg:#F2F4F1; --card:#FFFFFF; --ink:#17221E; --muted:#65716B; --line:#DCE2DD;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --accent:#5DB29A; --accent-ink:#0E1412; --accent-soft:#1C302A;

html,body{height:100%}

.chk{width:22px;height:22px;accent-color:var(--accent);flex:none}

.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-top:12px;font-weight:600}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}

.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}

.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:max(calc(50% - 214px),calc(16px + env(safe-area-inset-left,0px)));width:56px;height:56px;border-radius:18px;border:0;background:var(--usd);color:#fff;font-size:28px;box-shadow:var(--shadow);z-index:6}

.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20}

.sheet h3{margin:0;font-family:var(--f-num);font-size:17px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 8px}

<script>

const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ---------- dates ---------- */
const toD=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const fromD=t=>new Date(t).toISOString().slice(0,10);
const addDays=(s,n)=>fromD(toD(s)+n*864e5);

const dshort=s=>`${+s.slice(8)} ${MONTHS[+s.slice(5,7)-1]}`;
function shift(k,n){let [y,m]=k.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}
function mdiff(a,b){const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)}
const keyLabel=k=>MONTHS[+k.slice(5,7)-1]+' '+k.slice(0,4);
const keyFor=date=>+date.slice(8)>=20?shift(date.slice(0,7),1):date.slice(0,7); // salary late in month = next month's money

/* ---------- data ---------- */
function uid(){return Math.random().toString(36).slice(2,9)}
function sample(){

const nextP=p=>S.periods[idx(p)+1];
const openP=()=>S.periods.find(p=>!p.end);
function endOf(p){if(p.end)return p.end;if(p.planEnd)return p.planEnd;return addDays(addMonth(p.start),-1)}
const pname=p=>keyLabel(p.key);
const isRO=(p=P())=>!!(p&&p.end&&!UNLOCKED.has(p.id));
function periodFor(date){return S.periods.find(p=>date>=p.start&&(p.end?date<=p.end:true))}

/* installments & جمعية, by month key */
function plan(p,k){
  const i=mdiff(p.start,k), n=i+1, active=i>=0&&i<p.count;
  const paidCount=Object.keys(p.paid||{}).filter(x=>p.paid[x]&&mdiff(p.start,x)>=0&&mdiff(p.start,x)<p.count).length;
  const left=p.count-paidCount, end=shift(p.start,p.count-1);
  const payout=p.type==='جمعية'&&p.turn?shift(p.start,p.turn-1):null;
  return {n,active,paidNow:!!(p.paid||{})[k],paidCount,left,leftAmt:left*p.monthly,end,payout,payAmt:p.monthly*p.count,pct:paidCount/p.count*100};
}

function calc(p=P()){
  const k=p.key;
  const salaryEGP=p.salary.cur==='USD'?p.salary.amount*S.rate:p.salary.amount;
  const transUSD=p.transfers.reduce((a,t)=>a+t.usd,0);
  const transEGP=p.transfers.reduce((a,t)=>a+t.usd*t.rate,0);
  const income=p.salary.cur==='USD'?transEGP:p.salary.amount+transEGP;
  const act=S.plans.filter(x=>plan(x,k).active);
  const plansAll=act.reduce((a,x)=>a+x.monthly,0), plansPaid=act.filter(x=>(x.paid||{})[k]).reduce((a,x)=>a+x.monthly,0);
  const fixedAll=p.fixed.reduce((a,f)=>a+f.amount,0)+plansAll;
  const fixedPaid=p.fixed.filter(f=>f.paid).reduce((a,f)=>a+f.amount,0)+plansPaid;
  const daily=p.daily.reduce((a,d)=>a+d.amount,0);
  const end=endOf(p), D=ddiff(p.start,end)+1;
  const el=p.end?D:Math.max(0,Math.min(D,ddiff(p.start,TODAY)+1));
  const left=Math.max(0,D-el);
  const usdLeft=p.salary.cur==='USD'?Math.max(0,p.salary.amount-transUSD):0;
  const cash=income-fixedPaid-daily, free=income-fixedAll-daily;
  const avg=el?daily/el:0, projected=fixedAll+avg*D, budget=salaryEGP;
  const allow=left?(free+usdLeft*S.rate)/left:0;
  const spent=(p.end?fixedPaid:fixedAll)+daily;
  return {p,act,salaryEGP,transUSD,transEGP,income,fixedAll,fixedPaid,daily,end,D,el,left,usdLeft,cash,free,avg,projected,budget,allow,spent};
}

/* debts */
function debtInfo(d){const paid=d.payments.reduce((a,x)=>a+x.amount,0);return {paid,left:Math.max(0,d.total-paid),pct:Math.min(100,paid/Math.max(1,d.total)*100)}}
function debtRow(d){
  const i=debtInfo(d), mine=d.dir==='عليا';
  const last=[...d.payments].sort((a,b)=>b.date.localeCompare(a.date))[0];
  return `<div class="item"><div class="ic ${mine?'usd':''}">${esc(d.name).slice(0,1)}</div><div class="txt tap" data-debt="${d.id}">
    <b>${esc(d.name)} <span class="badge ${mine?'closed':'open'}">${mine?'عليّا له':'ليّا عنده'}</span></b>
    <span>الإجمالي ${fmt(d.total)} · ${mine?'دفعت':'رجّعلي'} ${fmt(i.paid)} · ${i.left?`<b class="${mine?'bad':'good'}">متبقي ${fmt(i.left)} ج.م</b>`:'<b class="good">خلصت</b>'}</span>
    <div class="meter" style="height:6px;margin:6px 0 4px"><i style="width:${i.pct}%;background:var(${mine?'--usd':'--accent'})"></i></div>
    <span>${last?`آخر دفعة ${fmt(last.amount)} يوم ${dshort(last.date)} · `:''}${d.payments.length} دفعة${d.note?' · '+esc(d.note):''} · <span class="hint">سجّل دفعة</span></span></div></div>`;
}
function debtsSection(full){
  const owe=S.debts.filter(d=>d.dir==='عليا').reduce((a,d)=>a+debtInfo(d).left,0);
  const lent=S.debts.filter(d=>d.dir==='ليا').reduce((a,d)=>a+debtInfo(d).left,0);
  if(!full&&!S.debts.length) return '';
  return `<section>
    <h2>الديون والسلف ${full?'<span class="sub">مين عليه ومين ليه</span>':'<button class="chip" data-go="fixed">التفاصيل</button>'}</h2>
    <div class="stats">
      <div class="stat"><span>عليّا لناس (متبقي)</span><b class="${owe?'bad':''}">${egp(owe)}</b></div>
      <div class="stat"><span>ليّا عند ناس (متبقي)</span><b class="${lent?'good':''}">${egp(lent)}</b></div>
    </div>
    ${full?`<div class="card list">${S.debts.length?S.debts.map(debtRow).join(''):'<div class="empty">مفيش ديون مسجلة</div>'}</div>
    <div class="btnrow"><button class="btn" data-open="debt">+ دين أو سلفة جديدة</button></div>`:''}
  </section>`;
}

    <button class="chip" data-act="${ro?'unlock':'lock'}">${ro?'افتحه للتعديل':'اقفله تاني'}</button></div>`;
}

function histRow(p){

  return `<div class="hist ${p.id===curId?'on':''}" data-period="${p.id}">
    <b>${pname(p)} <span class="badge ${p.end?'closed':'open'}">${p.end?'مقفول':'الحالي'}</span></b>

    <span>${dshort(p.start)} ← ${p.end?dshort(p.end):'لحد دلوقتي'}</span>
    <span class="r">مصروفات · ${diff>=0?`<span class="good">وفّرت ${fmt(diff)}</span>`:`<span class="bad">زيادة ${fmt(-diff)}</span>`}</span>
  </div>`;
}
function planRow(x,withX){
  const k=P().key, i=plan(x,k), isJ=x.type==='جمعية';
  const status=i.left<=0?'<b class="good">خلصت</b>':isJ?`متبقي <b class="num">${i.left}</b> شهر`:`متبقي <b class="num">${i.left}</b> قسط`;
  let extra=i.left>0?`آخر ${isJ?'شهر':'قسط'} ${keyLabel(i.end)} · باقي ${egp(i.leftAmt)}`:'';
  if(isJ&&i.payout){const d=mdiff(k,i.payout);extra+=`<br>${d>0?`دورك تقبض في ${keyLabel(i.payout)} (بعد ${d} شهر)`:d===0?'دورك تقبض الشهر ده':'قبضت في '+keyLabel(i.payout)}: <b>${egp(i.payAmt)}</b>`}
  return `<div class="item plan"><div class="ic ${isJ?'usd':''}">${isJ?'ج':'ق'}</div><div class="txt ${withX?'tap':''}" ${withX?`data-editplan="${x.id}"`:''}><b>${esc(x.name)} <span class="muted" style="font-weight:400">· ${fmt(x.monthly)} ج/شهر</span></b>

   <div class="meter" style="height:6px;margin:6px 0 4px"><i style="width:${i.pct}%;background:var(${isJ?'--usd':'--accent'})"></i></div>
   <span>${extra}</span></div>${withX?`<button class="x" data-delplan="${x.id}" aria-label="امسح">×</button>`:''}</div>`;
}

function renameCat(list,old,nw){
  if(!nw||old===nw)return false; if(S[list].includes(nw)){toast('الاسم ده موجود');return false}

function closeSheet(){$('#overlay').innerHTML=''}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
const numv=id=>parseFloat(String(($(id)||{}).value||'').replace(/,/g,''))||0;

/* ---------- render ---------- */
let SALCUR=null;
function render(){
  SALCUR=null;
  const p=P();
  if(!p){
    $('#mLabel').innerHTML='—';
    $('#view').innerHTML=tab==='settings'?settings():onboarding();
  } else {
    $('#mLabel').innerHTML=`${pname(p)}<small>${dshort(p.start)} ← ${p.end?dshort(p.end):'دلوقتي'}</small>`;
    $('#view').innerHTML={home,daily,fixed,money,settings}[tab]();
  }
  $('#mPrev').disabled=!p||!prevP(p); $('#mNext').disabled=!p||!nextP(p);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#fab').hidden=tab==='settings'||!p||isRO();
  if(tab==='money'&&p){updConv();updSal()}
}
function updSal(){const o=$('#salConv');if(!o)return;const a=numv('#salAmt'),r=numv('#salRate')||S.rate,c=SALCUR||P().salary.cur;
  o.textContent=c==='USD'?fmt(a*r)+' ج.م':'$'+fmt(a/r)}
function updConv(){const o=$('#cvOut');if(o)o.textContent=fmt(numv('#cvUsd')*numv('#cvRate'))+' ج.م'}
const go=t=>{tab=t;filter='الكل';render();scrollTo(0,0)};
const RO_MSG='الشهر ده مقفول. افتحه للتعديل الأول';

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-act],[data-edit],[data-editplan],[data-editcat],[data-period],[data-debt]'); if(!t||t.disabled) return;
  if(t.dataset.period){curId=t.dataset.period;render();scrollTo(0,0);return}
  if(t.dataset.edit){if(isRO()){toast(RO_MSG);return}const [list,id]=t.dataset.edit.split(':');const o=P()[list].find(x=>x.id===id);if(o)openSheet(list,o);return}
  if(t.dataset.debt){const o=S.debts.find(x=>x.id===t.dataset.debt);if(o)openSheet('debtPay',o);return}
  if(t.dataset.editplan){const o=S.plans.find(x=>x.id===t.dataset.editplan);if(o)openSheet('plan',o);return}
  if(t.dataset.editcat){const [list,i]=t.dataset.editcat.split(':');openSheet('cat',{list,name:S[list][+i]});return}
  if(t.dataset.salcur){SALCUR=t.dataset.salcur;t.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));$('label[for=salAmt]').textContent='المرتب '+(SALCUR==='USD'?'بالدولار':'بالجنيه');$('#salConvL').textContent=SALCUR==='USD'?'يساوي تقريباً بالجنيه':'يساوي تقريباً بالدولار';updSal();return}
  if(t.dataset.step){$('#salAmt').value=Math.max(0,numv('#salAmt')+ +t.dataset.step);updSal();return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.filter){filter=t.dataset.filter;render();return}
  if(t.dataset.open){if(isRO()&&t.dataset.open!=='plan'&&t.dataset.open!=='newPeriod'){toast(RO_MSG);return}openSheet(t.dataset.open);return}
  if(t.dataset.pick){t.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));if(t.parentNode.id==='pType')$('#pTurnF').hidden=t.dataset.pick!=='جمعية';return}
  if(t.dataset.delplan){S.plans=S.plans.filter(x=>x.id!==t.dataset.delplan);save();render();toast('اتمسح');return}
  if(t.dataset.del){const [list,id]=t.dataset.del.split(':');const p=P();p[list]=p[list].filter(x=>x.id!==id);save();render();toast('اتمسح');return}
  if(t.dataset.delcat){const [list,i]=t.dataset.delcat.split(':');S[list].splice(+i,1);save();render();return}
  const a=t.dataset.act;
  if(a==='close') closeSheet();
  if(a==='goMoney'){go('money');return}
  if(a==='unlock'){UNLOCKED.add(curId);render();toast('تقدر تعدّل الشهر ده دلوقتي');return}
  if(a==='lock'){UNLOCKED.delete(curId);render();toast('اتقفل');return}
  if(a==='saveDebt'){const name=$('#dName').value.trim(),total=numv('#dTotal');if(!name||!total){toast('اكتب الاسم والمبلغ');return}
    const dir=$('#dDir .chip.on').dataset.pick,note=$('#dNote').value.trim();
    if(EDIT){Object.assign(S.debts.find(x=>x.id===EDIT),{name,total,dir,note});save();closeSheet();render();toast('اتعدّل');return}
    const d={id:uid(),name,dir,total,note,payments:[]};const pd=numv('#dPaid');if(pd)d.payments.push({id:uid(),date:TODAY,amount:pd});
    S.debts.push(d);save();closeSheet();render();toast(`اتسجل · متبقي ${fmt(debtInfo(d).left)} ج.م`);return}
  if(a==='editDebt'){openSheet('debt',S.debts.find(x=>x.id===t.dataset.id));return}
  if(a==='saveDebtPay'){const d=S.debts.find(x=>x.id===t.dataset.id),amount=numv('#dpAmt'),date=$('#dpDate').value||TODAY;if(!amount){toast('اكتب مبلغ الدفعة');return}
    const pay={id:uid(),date,amount};
    if($('#dpExp')&&$('#dpExp').checked){const tp=periodFor(date);if(tp&&!isRO(tp)){if(!S.cats.includes('سداد ديون'))S.cats.push('سداد ديون');const did=uid();tp.daily.push({id:did,date,cat:'سداد ديون',amount,note:'سداد لـ '+d.name});pay.daily=did}}
    d.payments.push(pay);save();render();openSheet('debtPay',d);const i=debtInfo(d);toast(i.left?`اتسجل · متبقي ${fmt(i.left)} ج.م`:'خلصت الدين كله');return}
  if(a==='delDebtPay'){const d=S.debts.find(x=>x.id===t.dataset.id);const pay=d.payments.find(x=>x.id===t.dataset.pid);
    if(pay&&pay.daily)S.periods.forEach(p=>{p.daily=p.daily.filter(x=>x.id!==pay.daily)});
    d.payments=d.payments.filter(x=>x.id!==t.dataset.pid);save();render();openSheet('debtPay',d);toast('اتمسحت الدفعة');return}
  if(a==='savePeriod'){
    const date=$('#nDate').value, key=$('#nKey').value, amount=numv('#nAmt'), cur=($('#nCur .chip.on')||{}).dataset?.pick||'USD';
    if(!date||!key){toast('اختار التاريخ والشهر');return}
    if(!amount){toast('اكتب مبلغ المرتب');return}
    const op=openP();
    if(op&&date<=op.start){toast('التاريخ لازم يكون بعد '+dshort(op.start)+' (بداية '+pname(op)+')');return}
    const nr=numv('#nRate'); if(nr) S.rate=nr;
    const np={id:uid(),key,start:date,end:null,salary:{amount,cur},transfers:[],fixed:[],daily:[]};
    let msg='بدأ حساب '+keyLabel(key)+' من '+dshort(date);
    if(op){
      op.end=addDays(date,-1); delete op.planEnd;
      const moved=op.daily.filter(d=>d.date>=date); op.daily=op.daily.filter(d=>d.date<date); np.daily.push(...moved);
      const mt=op.transfers.filter(d=>d.date>=date); op.transfers=op.transfers.filter(d=>d.date<date); np.transfers.push(...mt);
      if($('#nCopy')&&$('#nCopy').checked) np.fixed=op.fixed.map(f=>({...f,id:uid(),paid:false}));
      const c=calc(op); msg=`اتقفل ${pname(op)}: إجمالي المصروفات ${fmt(c.spent)} ج.م · وبدأ ${keyLabel(key)}`;
    }
    S.periods.push(np); sortP(); curId=np.id; save(); closeSheet(); tab='home'; render(); scrollTo(0,0); toast(msg); return}
  if(a==='saveDaily'){const amount=numv('#fAmt');if(!amount){toast('اكتب المبلغ الأول');return}
    const date=$('#fDate').value||TODAY; const target=periodFor(date);
    if(!target){toast('التاريخ ده قبل بداية الحساب ('+dshort(S.periods[0].start)+')');return}
    if(isRO(target)){toast('التاريخ ده في '+pname(target)+' وهو مقفول');return}
    const rec={date,cat:($('#fCats .chip.on')||{}).dataset?.pick||'أخرى',amount,note:$('#fNote').value.trim()};
    if(EDIT)S.periods.forEach(p=>{p.daily=p.daily.filter(x=>x.id!==EDIT)});
    target.daily.push({id:EDIT||uid(),...rec});
    save();closeSheet();render();toast((EDIT?'اتعدّل':'اتسجل '+fmt(amount)+' ج.م')+(target.id!==curId?' في '+pname(target):''));return}
  if(a==='saveFixed'){const amount=numv('#fAmt'),name=$('#fName').value.trim();if(!amount||!name){toast('اكتب الاسم والمبلغ');return}
    const cat=$('#fCat').value, p=P();
    if(EDIT){const f=p.fixed.find(x=>x.id===EDIT);const old=f.name;Object.assign(f,{name,cat,amount});
      if($('#fAll')&&$('#fAll').checked)S.periods.slice(idx(p)+1).forEach(q=>q.fixed.forEach(x=>{if(x.name===old)Object.assign(x,{name,cat,amount})}));
      save();closeSheet();render();toast('اتعدّل');return}
    p.fixed.push({id:uid(),name,cat,amount,paid:false});save();closeSheet();render();toast('اتضاف');return}
  if(a==='catAdd'||a==='catRen'){const list=t.dataset.list;CATMODE=a;const inp=$('#catIn');$('#catBox').hidden=false;
    inp.value=a==='catRen'?(selCat(list)||''):'';inp.placeholder=a==='catAdd'?'اكتب اسم النوع الجديد، مثلاً: مصاريف البيت':'الاسم الجديد';inp.focus();return}
  if(a==='catOk'){const list=t.dataset.list,v=$('#catIn').value.trim();if(!v){toast('اكتب الاسم');return}
    if(CATMODE==='catAdd'){if(S[list].includes(v)){toast('الاسم ده موجود');return}S[list].push(v);save()}
    else{const old=selCat(list);if(!old){toast('اختار نوع الأول');return}if(!renameCat(list,old,v))return}
    refreshCatsInSheet(list,v);$('#catBox').hidden=true;toast(CATMODE==='catAdd'?'اتضاف «'+v+'»':'بقى اسمه «'+v+'»');return}
  if(a==='catSave'){const v=$('#cName').value.trim();if(!v){toast('اكتب الاسم');return}
    if(renameCat(t.dataset.list,t.dataset.old,v)){closeSheet();render();toast('بقى اسمه «'+v+'»')}return}
  if(a==='delEdit'){const k=t.dataset.kind;
    if(k==='plan')S.plans=S.plans.filter(x=>x.id!==EDIT);
    else if(k==='debt')S.debts=S.debts.filter(x=>x.id!==EDIT); else S.periods.forEach(p=>{p[k]=p[k].filter(x=>x.id!==EDIT)});
    save();closeSheet();render();toast('اتمسح');return}
  if(a==='saveSalary'){const p=P();const start=$('#salStart').value,end=$('#salEnd').value,key=$('#salKey').value;
    const pv=prevP(p),nx=nextP(p);
    if(!start||!end||end<start){toast('آخر يوم لازم يكون بعد أول يوم');return}
    if(pv&&start<=pv.start){toast('أول يوم لازم يكون بعد '+dshort(pv.start));return}
    if(nx&&end>=nx.start){toast('آخر يوم لازم يكون قبل '+dshort(nx.start)+' (بداية '+pname(nx)+')');return}
    p.start=start; if(p.end)p.end=end; else p.planEnd=end; if(key)p.key=key;
    if(pv)pv.end=addDays(start,-1);
    p.salary={amount:numv('#salAmt'),cur:SALCUR||p.salary.cur};const r=numv('#salRate');if(r)S.rate=r;
    save();render();toast('اتحفظ مرتب '+pname(p));return}
  if(a==='salPrev'){const pv=prevP(P());if(!pv){toast('مفيش شهر قبله');return}$('#salAmt').value=pv.salary.amount;SALCUR=pv.salary.cur;
    document.querySelectorAll('#salCurChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.salcur===SALCUR));updSal();return}
  if(a==='savePlan'){const name=$('#pName').value.trim(),monthly=numv('#pAmt'),count=Math.round(numv('#pCount')),start=$('#pStart').value||TODAY.slice(0,7);
    if(!name||!monthly||!count){toast('اكتب الاسم والمبلغ وعدد الشهور');return}
    const type=$('#pType .chip.on').dataset.pick, paid={};
    for(let i=0;i<count;i++){const k=shift(start,i);if(k<TODAY.slice(0,7))paid[k]=1}
    const turn=type==='جمعية'?Math.min(Math.round(numv('#pTurn'))||0,count):0;
    if(EDIT){const old=S.plans.find(x=>x.id===EDIT);Object.assign(old,{type,name,monthly,count,start});if(turn)old.turn=turn;else delete old.turn;
      save();closeSheet();render();const i=plan(old,P()?P().key:start);toast(`اتعدّل · متبقي ${i.left} ${type==='جمعية'?'شهر':'قسط'}`);return}
    const x={id:uid(),type,name,monthly,count,start,paid};if(turn)x.turn=turn;
    S.plans.push(x);save();closeSheet();render();const i=plan(x,start);toast(`اتضاف · متبقي ${i.left} ${type==='جمعية'?'شهر':'قسط'}`);return}
  if(a==='copyFixed'){const pv=prevP(P());const p=P();const have=new Set(p.fixed.map(f=>f.name));
    pv.fixed.forEach(f=>{if(!have.has(f.name))p.fixed.push({...f,id:uid(),paid:false})});save();render();toast('اتنسخت الأساسيات');return}
  if(a==='saveTransfer'){const u=numv('#cvUsd'),r=numv('#cvRate');if(!u||!r){toast('اكتب المبلغ والسعر');return}
    const p=P();p.transfers.push({id:uid(),date:p.end?p.start:TODAY,usd:u,rate:r});save();render();toast('اتسجل تحويل $'+fmt(u));return}
  if(a==='addCat'){const list=t.dataset.list;const inp=$(list==='cats'?'#newCat':'#newFixedCat');const v=inp.value.trim();if(!v)return;if(!S[list].includes(v))S[list].push(v);save();render();toast('اتضاف النوع');return}
  if(a==='fresh'){if(!t.dataset.sure){t.dataset.sure='1';t.textContent='متأكد؟ اضغط تاني وهيتمسح كل اللي فات';t.classList.add('danger');return}
    S={rate:S.rate,cats:S.cats,fixedCats:S.fixedCats,plans:[],debts:[],periods:[]};curId=null;save();tab='home';render();openSheet('newPeriod');return}
  if(a==='backup'){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='masrofat-elbeit-backup-'+TODAY+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('اتنزلت النسخة الاحتياطية');return}
  if(a==='restore'){$('#restoreFile').click();return}
  if(a==='reset'){if(S.periods.length&&!t.dataset.sure){t.dataset.sure='1';t.textContent='متأكد؟ أرقامك هتتمسح. اضغط تاني';return}S=sample();curId=S.periods[S.periods.length-1].id;save();tab='home';render();toast('رجعت الأرقام المثال');return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ppaid){const x=S.plans.find(y=>y.id===t.dataset.ppaid);if(x){const k=P().key;x.paid=x.paid||{};if(t.checked)x.paid[k]=1;else delete x.paid[k];save();render();const i=plan(x,k);toast(i.left?`متبقي ${i.left} ${x.type==='جمعية'?'شهر':'قسط'}`:'خلصت')}}
  if(t.dataset.paid){const f=P().fixed.find(x=>x.id===t.dataset.paid);if(f){f.paid=t.checked;save();render()}}
  if(t.id==='restoreFile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.periods)throw 0;S=d;['cats','fixedCats','plans','periods','debts'].forEach(k=>{if(!S[k])S[k]=[]});curId=(S.periods[S.periods.length-1]||{}).id;save();tab='home';render();toast('رجعت النسخة الاحتياطية')}catch(e){toast('الملف ده مش نسخة احتياطية من البرنامج')}};fr.readAsText(t.files[0]);t.value='';return}
  if(t.id==='rate'){const r=numv('#rate');if(r){S.rate=r;save();toast('اتحفظ السعر')}}
  if(t.id==='nDate'){const d=t.value;if(d){$('#nKey').value=keyFor(d);const c=$('#nClose');if(c)c.textContent=dshort(addDays(d,-1))}}
});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='cvUsd'||id==='cvRate')updConv();
  if(id==='salAmt'||id==='salRate')updSal();
  if(id==='pAmt'||id==='pCount'){const n=Math.round(numv('#pCount')),st=$('#pStart').value||TODAY.slice(0,7);$('#pSum').innerHTML=`<span>الإجمالي${n?' · آخر شهر '+keyLabel(shift(st,n-1)):''}</span><b class="num">${fmt(numv('#pAmt')*n)} ج.م</b>`}
});
$('#fab').onclick=()=>openSheet(tab==='fixed'?'fixed':'daily');
$('#mPrev').onclick=()=>{const p=prevP(P());if(p){curId=p.id;render()}};
$('#mNext').onclick=()=>{const p=nextP(P());if(p){curId=p.id;render()}};
render();
})();
</script>

<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
